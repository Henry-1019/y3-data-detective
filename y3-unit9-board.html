<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>共享白板 · 学生画板</title>
<!--
  =====================================================================
  这是「共享白板」的学生端页面，跟 index.html（练习游戏）、y3-unit9-vote.html
  （举手统计）用同一个 Supabase 专案，只需要多建一张表：

  create table if not exists live_board (
    id text primary key default 'current',
    version int not null default 0,
    drawing_enabled boolean not null default false,
    snapshot text,
    updated_at timestamptz not null default now()
  );
  insert into live_board (id, version, drawing_enabled)
    values ('current', 0, false)
    on conflict (id) do nothing;

  alter table live_board enable row level security;

  drop policy if exists "anyone can read board" on live_board;
  create policy "anyone can read board" on live_board for select to anon using (true);
  drop policy if exists "anyone can write board" on live_board;
  create policy "anyone can write board" on live_board for insert to anon with check (true);
  drop policy if exists "anyone can update board" on live_board;
  create policy "anyone can update board" on live_board for update to anon using (true) with check (true);

  grant usage on schema public to anon, authenticated;
  grant select, insert, update on live_board to anon;

  跑完以上 SQL 后，记得到 Database → Publications，把 live_board 这张表
  也加进 supabase_realtime，不然「开放学生绘图」开关和老师清空/换背景时，
  学生端不会自动更新（要手动刷新才看得到）。画笔笔画本身是用 Supabase
  Realtime 的「广播」(broadcast) 即时传送的，不需要额外设置。

  部署方式：把这个文件跟 index.html、y3-unit9-vote.html、
  y3-unit9-lesson-vercel.html 放在同一个 GitHub 仓库根目录下，一起推上
  Vercel，网址就会是 你的网址.vercel.app/y3-unit9-board.html，这个网址
  就是要发给学生在课堂上打开、跟老师一起画画的。
  =====================================================================
-->
<style>
  :root{
    --bg:#FFF6E9; --panel:#FFFFFF; --ink:#2B2A33; --ink-soft:#6B6879; --line:#EFE2CC;
    --primary:#FF6B4A; --secondary:#2EC4B6; --shadow:0 10px 24px -12px rgba(43,42,51,.28);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column;
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  .title{ font-weight:800; font-size:16px; }
  .status{ font-size:12.5px; font-weight:700; color:var(--ink-soft); }
  .status.live{ color:#0B4A45; }
  .toolbar{ display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .color{ width:28px; height:28px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0; }
  .color.active{ border-color:var(--ink); box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--ink); }
  .eraser{ background:#FFEFD6; border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-weight:700; font-size:13px; cursor:pointer; }
  .eraser.active{ background:var(--primary); color:#fff; border-color:transparent; }
  .canvas-wrap{ position:relative; flex:1; background:#fff; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }
  .viewonly{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.72); font-weight:800; font-size:16px; color:var(--ink-soft); text-align:center; padding:24px; }
  .waiting{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--ink-soft); }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--primary); margin:0 2px; animation:pulse 1.2s infinite ease-in-out; }
  .dot:nth-child(2){ animation-delay:.2s; } .dot:nth-child(3){ animation-delay:.4s; }
  @keyframes pulse{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }
</style>
</head>
<body>
  <div class="topbar">
    <div class="title">📝 共享白板</div>
    <div class="status" id="statusText">正在连线…</div>
  </div>
  <div class="toolbar" id="toolbar" hidden>
    <button class="color active" data-color="#2B2A33" style="background:#2B2A33" type="button" aria-label="黑色"></button>
    <button class="color" data-color="#E63950" style="background:#E63950" type="button" aria-label="红色"></button>
    <button class="color" data-color="#2EC4B6" style="background:#2EC4B6" type="button" aria-label="绿色"></button>
    <button class="color" data-color="#5AC8FA" style="background:#5AC8FA" type="button" aria-label="蓝色"></button>
    <button class="eraser" id="eraserBtn" type="button">🧹 橡皮擦</button>
  </div>
  <div class="canvas-wrap">
    <canvas id="boardCanvas" width="640" height="400"></canvas>
    <div class="viewonly" id="viewonlyBanner" hidden>老师还没开放绘图，你现在只能看老师画 👀</div>
    <div class="waiting" id="waitingBanner"><span>正在连线<span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function(){
    "use strict";
    var SUPABASE_URL = "https://lfxabwakcthzcntqvbiy.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmeGFid2FrY3RoemNudHF2Yml5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTk1NTYsImV4cCI6MjEwNDQ3NTU1Nn0.O_5ut2mniPLTgeQ4Cy81_LhOVkgnwfALa7YVAA9PB30";

    var canvas = document.getElementById("boardCanvas");
    var ctx = canvas.getContext("2d");
    var statusEl = document.getElementById("statusText");
    var toolbarEl = document.getElementById("toolbar");
    var viewonlyEl = document.getElementById("viewonlyBanner");
    var waitingEl = document.getElementById("waitingBanner");

    var client = null;
    var channel = null;
    var boardVersion = 0;
    var drawingEnabled = false;
    var color = "#2B2A33";
    var erasing = false;
    var isDrawing = false;
    var lastPos = null;
    var snapshotTimer = null;

    function getPos(e){
      var rect = canvas.getBoundingClientRect();
      var scaleX = canvas.width / rect.width;
      var scaleY = canvas.height / rect.height;
      var clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
      var clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
      return { x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
    }

    function drawSegment(x0,y0,x1,y1,c,size,erase){
      ctx.save();
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.globalCompositeOperation = erase ? "destination-out" : "source-over";
      ctx.strokeStyle = c;
      ctx.lineWidth = size;
      ctx.beginPath();
      ctx.moveTo(x0,y0);
      ctx.lineTo(x1,y1);
      ctx.stroke();
      ctx.restore();
    }

    function broadcastStroke(x0,y0,x1,y1,c,size,erase){
      if (!channel) return;
      channel.send({ type:"broadcast", event:"stroke", payload:{x0:x0,y0:y0,x1:x1,y1:y1,color:c,size:size,erase:!!erase} });
    }

    function onPointerDown(e){
      if (!drawingEnabled) return;
      e.preventDefault();
      isDrawing = true;
      lastPos = getPos(e);
    }
    function onPointerMove(e){
      if (!isDrawing || !drawingEnabled) return;
      e.preventDefault();
      var pos = getPos(e);
      var c = erasing ? "#000000" : color;
      var size = erasing ? 22 : 4;
      drawSegment(lastPos.x, lastPos.y, pos.x, pos.y, c, size, erasing);
      broadcastStroke(lastPos.x, lastPos.y, pos.x, pos.y, c, size, erasing);
      lastPos = pos;
    }
    function onPointerUp(){
      if (!isDrawing) return;
      isDrawing = false;
      lastPos = null;
      scheduleSnapshot();
    }
    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);

    function scheduleSnapshot(){
      if (snapshotTimer) clearTimeout(snapshotTimer);
      snapshotTimer = setTimeout(saveSnapshot, 1200);
    }
    function saveSnapshot(){
      if (!client) return;
      var dataUrl = canvas.toDataURL("image/jpeg", 0.6);
      client.from("live_board").upsert({ id:"current", version:boardVersion, drawing_enabled:drawingEnabled, snapshot:dataUrl, updated_at:new Date().toISOString() });
    }

    function loadImage(dataUrl, cb){
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,canvas.width,canvas.height);
      if (!dataUrl){ if (cb) cb(); return; }
      var img = new Image();
      img.onload = function(){ ctx.drawImage(img,0,0,canvas.width,canvas.height); if (cb) cb(); };
      img.onerror = function(){ if (cb) cb(); };
      img.src = dataUrl;
    }

    function updatePermissionUI(){
      toolbarEl.hidden = !drawingEnabled;
      viewonlyEl.hidden = drawingEnabled;
    }

    function applyRow(row){
      if (!row) return;
      drawingEnabled = !!row.drawing_enabled;
      updatePermissionUI();
      if (row.version !== boardVersion){
        boardVersion = row.version;
        loadImage(row.snapshot);
      }
    }

    document.querySelectorAll(".color").forEach(function(b){
      b.addEventListener("click", function(){
        erasing = false;
        document.getElementById("eraserBtn").classList.remove("active");
        document.querySelectorAll(".color").forEach(function(x){ x.classList.remove("active"); });
        b.classList.add("active");
        color = b.dataset.color;
      });
    });
    document.getElementById("eraserBtn").addEventListener("click", function(){
      erasing = !erasing;
      this.classList.toggle("active", erasing);
      document.querySelectorAll(".color").forEach(function(b){ b.classList.remove("active"); });
    });

    function init(){
      if (typeof window.supabase === "undefined"){
        statusEl.textContent = "连不上服务器，请检查网络后重新整理页面。";
        waitingEl.querySelector("span").textContent = "连不上服务器，请检查网络";
        return;
      }
      try {
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch(e){
        statusEl.textContent = "连不上服务器，请重新整理页面。";
        return;
      }
      client.from("live_board").select("*").eq("id","current").maybeSingle().then(function(res){
        waitingEl.hidden = true;
        if (res.data) applyRow(res.data);
        else updatePermissionUI();
        statusEl.textContent = "已连线"; statusEl.className = "status live";
      }).catch(function(){
        statusEl.textContent = "连线失败，请重新整理页面。";
      });

      channel = client.channel("board-live")
        .on("broadcast", { event:"stroke" }, function(msg){
          var p = msg.payload;
          if (p) drawSegment(p.x0,p.y0,p.x1,p.y1,p.color,p.size,p.erase);
        })
        .subscribe();

      client.channel("board-row-watch")
        .on("postgres_changes", { event:"UPDATE", schema:"public", table:"live_board", filter:"id=eq.current" }, function(payload){
          applyRow(payload.new);
        })
        .subscribe();
    }

    init();
  })();
  </script>
</body>
</html>
