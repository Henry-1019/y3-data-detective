<title>共享白板 · 学生画板</title>
<!--
  =====================================================================
  这是「共享白板」的学生端页面，跟 index.html（练习游戏）、y3-unit9-vote.html
  （举手统计）用同一个 Supabase 专案，只需要多建一张表：

  create table if not exists live_board (
    id text primary key default 'current',
    version int not null default 0,
    allowed_client_ids jsonb not null default '[]'::jsonb,
    snapshot text,
    sub_active boolean not null default false,
    sub_round int not null default 0,
    updated_at timestamptz not null default now()
  );
  insert into live_board (id, version, allowed_client_ids)
    values ('current', 0, '[]'::jsonb)
    on conflict (id) do nothing;

  -- 如果之前已经建过 live_board 表（旧版本用的是 drawing_enabled 布尔栏位，
  -- 或者还没有个人练习功能），只需要多跑这几行，把新栏位加上去就好，不用重建整张表：
  -- alter table live_board add column if not exists allowed_client_ids jsonb not null default '[]'::jsonb;
  -- alter table live_board add column if not exists sub_active boolean not null default false;
  -- alter table live_board add column if not exists sub_round integer not null default 0;

  alter table live_board enable row level security;

  drop policy if exists "anyone can read board" on live_board;
  create policy "anyone can read board" on live_board for select to anon using (true);
  drop policy if exists "anyone can write board" on live_board;
  create policy "anyone can write board" on live_board for insert to anon with check (true);
  drop policy if exists "anyone can update board" on live_board;
  create policy "anyone can update board" on live_board for update to anon using (true) with check (true);

  grant usage on schema public to anon, authenticated;
  grant select, insert, update on live_board to anon;

  -- 「各自练习」模式：每个被授权的学生会拿到一个只有自己看得到的空白画板，
  -- 写完按「提交」，画面会存进这张新表，老师端会即时收到、显示成可以拖动/
  -- 缩放的小图，方便一次检查全班的做法（不用大家轮流用同一块画板）。
  create table if not exists board_submissions (
    round integer not null,
    client_id text not null,
    name text not null,
    snapshot text not null,
    updated_at timestamptz not null default now(),
    primary key (round, client_id)
  );
  alter table board_submissions enable row level security;
  drop policy if exists "anyone can read submissions" on board_submissions;
  create policy "anyone can read submissions" on board_submissions for select to anon using (true);
  drop policy if exists "anyone can write submissions" on board_submissions;
  create policy "anyone can write submissions" on board_submissions for insert to anon with check (true);
  drop policy if exists "anyone can update submissions" on board_submissions;
  create policy "anyone can update submissions" on board_submissions for update to anon using (true) with check (true);
  grant select, insert, update on board_submissions to anon;

  跑完以上 SQL 后，记得到 Database → Publications，把 live_board 和
  board_submissions 这两张表都加进 supabase_realtime，不然老师授权、清空/
  换背景、收到学生提交时，另一边不会自动更新（要手动刷新才看得到）。画笔
  笔画本身是用 Supabase Realtime 的「广播」(broadcast) 即时传送的，不需要
  额外设置；学生名单则是用 Supabase Realtime 的「presence」功能即时显示，
  同样不需要额外设置。

  权限模式：学生进入这个页面时会先输入名字，老师在课堂手册的「共享白板」
  面板里会看到即时更新的在线学生名单，勾选哪个学生的名字，那个学生才能
  画；没被勾选的学生只能看，不能画。

  两种画画模式：
  1. 共享模式（预设）：被授权的学生跟老师画在同一块板上，大家都看得到
     即时画面。
  2. 各自练习模式：老师在「共享白板」面板按「开始各自练习」后，被授权的
     学生会各自拿到一块「只有自己看得到」的空白画板，写完按「提交给
     老师」；老师那边会自动出现每个学生的画面（小图，标着名字），老师
     可以拖动、放大缩小来检查每个人的步骤——这样即使一班很多人，大家
     也都有自己的画板可以参与，不用轮流等一块共享板。

  部署方式：把这个文件跟 index.html、y3-unit9-vote.html、
  y3-unit9-lesson-vercel.html 放在同一个 GitHub 仓库根目录下，一起推上
  Vercel，网址就会是 你的网址.vercel.app/y3-unit9-board.html，这个网址
  就是要发给学生在课堂上打开、跟老师一起画画的。
  =====================================================================
-->
<style>
  :root{
    --bg:#FFF6E9; --panel:#FFFFFF; --ink:#2B2A33; --ink-soft:#6B6879; --line:#EFE2CC;
    --primary:#FF6B4A; --secondary:#2EC4B6; --shadow:0 10px 24px -12px rgba(43,42,51,.28);
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column;
  }
  .name-gate{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .name-card{ background:var(--panel); border-radius:24px; box-shadow:var(--shadow); padding:28px 24px; max-width:360px; width:100%; text-align:center; }
  .name-card .badge{ font-size:34px; margin-bottom:8px; }
  .name-card h1{ font-size:18px; margin:0 0 6px; }
  .name-card p{ font-size:13px; color:var(--ink-soft); margin:0 0 18px; }
  .name-input{ width:100%; font:inherit; font-size:16px; padding:12px 14px; border-radius:14px; border:2px solid var(--line); text-align:center; margin-bottom:12px; }
  .name-input:focus{ outline:none; border-color:var(--primary); }
  .name-go{ width:100%; font:inherit; font-weight:800; font-size:15px; background:var(--primary); color:#fff; border:none; border-radius:14px; padding:12px; cursor:pointer; }
  .name-go[disabled]{ opacity:.5; cursor:default; }
  .name-err{ font-size:12px; color:#B4242E; min-height:16px; margin-top:6px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  .title{ font-weight:800; font-size:16px; }
  .title .me{ font-weight:700; font-size:12px; color:var(--ink-soft); margin-left:6px; }
  .title .me button{ font:inherit; border:none; background:none; color:var(--primary); text-decoration:underline; cursor:pointer; padding:0; margin-left:4px; }
  .status{ font-size:12.5px; font-weight:700; color:var(--ink-soft); }
  .status.live{ color:#0B4A45; }
  .toolbar{ display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .color{ width:28px; height:28px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0; }
  .color.active{ border-color:var(--ink); box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--ink); }
  .eraser{ background:#FFEFD6; border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-weight:700; font-size:13px; cursor:pointer; }
  .eraser.active{ background:var(--primary); color:#fff; border-color:transparent; }
  #submitBtn{ background:var(--secondary); color:#fff; border-color:transparent; }
  #submitBtn.submitted{ background:#8FD9D0; }
  .canvas-wrap{ position:relative; flex:1; background:#fff; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }
  .viewonly{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.72); font-weight:800; font-size:16px; color:var(--ink-soft); text-align:center; padding:24px; }
  .waiting{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--ink-soft); }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--primary); margin:0 2px; animation:pulse 1.2s infinite ease-in-out; }
  .dot:nth-child(2){ animation-delay:.2s; } .dot:nth-child(3){ animation-delay:.4s; }
  @keyframes pulse{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }
</style>
</head>
<body>
  <div class="name-gate" id="nameGate">
    <div class="name-card">
      <div class="badge">🖐️</div>
      <h1>加入共享白板</h1>
      <p>请输入你的名字，老师会看到你的名字，才能授权你一起画。</p>
      <input class="name-input" id="nameInput" type="text" maxlength="12" placeholder="例如：小明">
      <button class="name-go" id="nameGoBtn" type="button">进入白板</button>
      <div class="name-err" id="nameErr"></div>
    </div>
  </div>

  <div class="topbar" id="topbar" hidden>
    <div class="title">📝 共享白板<span class="me" id="meLabel"></span><span class="me"><button id="changeNameBtn" type="button">换名字</button></span></div>
    <div class="status" id="statusText">正在连线…</div>
  </div>
  <div class="toolbar" id="toolbar" hidden>
    <button class="color active" data-color="#2B2A33" style="background:#2B2A33" type="button" aria-label="黑色"></button>
    <button class="color" data-color="#E63950" style="background:#E63950" type="button" aria-label="红色"></button>
    <button class="color" data-color="#2EC4B6" style="background:#2EC4B6" type="button" aria-label="绿色"></button>
    <button class="color" data-color="#5AC8FA" style="background:#5AC8FA" type="button" aria-label="蓝色"></button>
    <button class="eraser" id="eraserBtn" type="button">🧹 橡皮擦</button>
    <button class="eraser" id="submitBtn" type="button" hidden>📤 提交给老师</button>
    <span id="submitStatus" style="font-size:12.5px;font-weight:700;color:var(--ink-soft);"></span>
  </div>
  <div class="canvas-wrap" id="canvasWrap" hidden>
    <canvas id="boardCanvas" width="1280" height="800"></canvas>
    <div class="viewonly" id="viewonlyBanner" hidden>老师还没授权你绘图，你现在只能看 👀</div>
    <div class="waiting" id="waitingBanner"><span>正在连线<span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function(){
    "use strict";
    var SUPABASE_URL = "https://lfxabwakcthzcntqvbiy.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmeGFid2FrY3RoemNudHF2Yml5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTk1NTYsImV4cCI6MjEwNDQ3NTU1Nn0.O_5ut2mniPLTgeQ4Cy81_LhOVkgnwfALa7YVAA9PB30";
    var NAME_KEY = "y3board_name";
    var CLIENT_KEY = "y3board_client_id";

    var nameGate = document.getElementById("nameGate");
    var nameInput = document.getElementById("nameInput");
    var nameGoBtn = document.getElementById("nameGoBtn");
    var nameErr = document.getElementById("nameErr");
    var topbar = document.getElementById("topbar");
    var meLabel = document.getElementById("meLabel");
    var canvasWrap = document.getElementById("canvasWrap");
    var canvas = document.getElementById("boardCanvas");
    var ctx = canvas.getContext("2d");
    var statusEl = document.getElementById("statusText");
    var toolbarEl = document.getElementById("toolbar");
    var viewonlyEl = document.getElementById("viewonlyBanner");
    var waitingEl = document.getElementById("waitingBanner");
    var changeNameBtn = document.getElementById("changeNameBtn");
    var submitBtn = document.getElementById("submitBtn");
    var submitStatusEl = document.getElementById("submitStatus");

    var myName = "";
    var myClientId = "";
    var client = null;
    var channel = null;
    var presenceChannel = null;
    var boardVersion = 0;
    var boardStateLoaded = false;
    var allowedIds = [];
    var drawingEnabled = false;
    var subActive = false; // 老师是否开启了「各自练习」模式
    var subRound = 0;
    var submitted = false; // 这一轮是否已经提交过
    var color = "#2B2A33";
    var erasing = false;
    var isDrawing = false;
    var lastPos = null;
    var snapshotTimer = null;
    var boardStrokes = []; // {id, owner, color, size, pts:[{x,y},...]}
    var boardBgImage = null;
    var currentStroke = null;
    var ERASE_RADIUS = 30; // 橡皮擦命中判定半径（配合 1280x800 画板分辨率）

    function makeClientId(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }

    function getPos(e){
      var rect = canvas.getBoundingClientRect();
      var scaleX = canvas.width / rect.width;
      var scaleY = canvas.height / rect.height;
      var clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
      var clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
      return { x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
    }

    function drawSegment(x0,y0,x1,y1,c,size){
      ctx.save();
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.globalCompositeOperation = "source-over";
      ctx.strokeStyle = c;
      ctx.lineWidth = size;
      ctx.beginPath();
      ctx.moveTo(x0,y0);
      ctx.lineTo(x1,y1);
      ctx.stroke();
      ctx.restore();
    }

    function redrawBoard(){
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,canvas.width,canvas.height);
      if (boardBgImage){
        var bw = boardBgImage.width, bh = boardBgImage.height;
        if (bw && bh){
          var ratio = Math.min(canvas.width/bw, canvas.height/bh);
          var w = bw*ratio, h = bh*ratio;
          var offX = (canvas.width-w)/2, offY = (canvas.height-h)/2;
          ctx.drawImage(boardBgImage, offX, offY, w, h);
        }
      }
      boardStrokes.forEach(function(s){
        ctx.save();
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = s.color; ctx.lineWidth = s.size;
        if (s.type === "line"){
          ctx.beginPath();
          ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2);
          ctx.stroke();
        } else if (s.type === "rect"){
          var rx = Math.min(s.x1,s.x2), ry = Math.min(s.y1,s.y2), rw = Math.abs(s.x2-s.x1), rh = Math.abs(s.y2-s.y1);
          ctx.strokeRect(rx, ry, rw, rh);
        } else if (s.type === "ellipse"){
          var ecx = (s.x1+s.x2)/2, ecy = (s.y1+s.y2)/2, erx = Math.abs(s.x2-s.x1)/2, ery = Math.abs(s.y2-s.y1)/2;
          ctx.beginPath();
          ctx.ellipse(ecx, ecy, Math.max(erx,0.01), Math.max(ery,0.01), 0, 0, Math.PI*2);
          ctx.stroke();
        } else if (s.pts && s.pts.length === 1){
          ctx.beginPath();
          ctx.arc(s.pts[0].x, s.pts[0].y, s.size/2, 0, Math.PI*2);
          ctx.fillStyle = s.color; ctx.fill();
        } else if (s.pts && s.pts.length > 1){
          ctx.beginPath();
          ctx.moveTo(s.pts[0].x, s.pts[0].y);
          for (var i=1;i<s.pts.length;i++) ctx.lineTo(s.pts[i].x, s.pts[i].y);
          ctx.stroke();
        }
        ctx.restore();
      });
    }

    function distToSeg(px,py,x1,y1,x2,y2){
      var dx=x2-x1, dy=y2-y1;
      var lenSq = dx*dx+dy*dy;
      var t = lenSq ? ((px-x1)*dx+(py-y1)*dy)/lenSq : 0;
      t = Math.max(0, Math.min(1, t));
      var cx = x1+t*dx, cy = y1+t*dy;
      return Math.hypot(px-cx, py-cy);
    }
    function strokeHit(stroke, px, py, radius){
      if (!stroke.pts || !stroke.pts.length) return false;
      if (stroke.pts.length === 1){
        return Math.hypot(px-stroke.pts[0].x, py-stroke.pts[0].y) <= radius;
      }
      for (var i=1;i<stroke.pts.length;i++){
        if (distToSeg(px,py,stroke.pts[i-1].x,stroke.pts[i-1].y,stroke.pts[i].x,stroke.pts[i].y) <= radius) return true;
      }
      return false;
    }

    /* 学生的橡皮擦只能擦自己画的部分——背景图和别人（老师、其他同学）画的东西都擦不到 */
    function eraseBoardAt(pos){
      var changed = false;
      for (var i = boardStrokes.length-1; i>=0; i--){
        var s = boardStrokes[i];
        if (s.owner !== myClientId) continue;
        if (strokeHit(s, pos.x, pos.y, ERASE_RADIUS + s.size/2)){
          boardStrokes.splice(i,1);
          broadcastErase(s.id);
          changed = true;
        }
      }
      if (changed) redrawBoard();
    }

    function broadcastStroke(strokeId, owner, x0,y0,x1,y1,c,size){
      if (!channel || subActive) return; // 各自练习模式下是私人画板，不广播给其他人
      channel.send({ type:"broadcast", event:"stroke", payload:{strokeId:strokeId, owner:owner, x0:x0,y0:y0,x1:x1,y1:y1,color:c,size:size} });
    }
    function broadcastErase(strokeId){
      if (!channel || subActive) return;
      channel.send({ type:"broadcast", event:"eraseStroke", payload:{strokeId:strokeId} });
    }

    function onPointerDown(e){
      if (!drawingEnabled) return;
      e.preventDefault();
      isDrawing = true;
      var pos = getPos(e);
      lastPos = pos;
      if (subActive && submitted){ submitted = false; updateSubmitUI(); }
      if (erasing){
        eraseBoardAt(pos);
      } else {
        currentStroke = { id: myClientId+"-"+Date.now()+"-"+Math.random().toString(36).slice(2), owner: myClientId, color: color, size: 8, pts:[pos] };
        boardStrokes.push(currentStroke);
      }
    }
    function onPointerMove(e){
      if (!isDrawing || !drawingEnabled) return;
      e.preventDefault();
      var pos = getPos(e);
      if (erasing){
        eraseBoardAt(pos);
      } else if (currentStroke){
        currentStroke.pts.push(pos);
        drawSegment(lastPos.x, lastPos.y, pos.x, pos.y, currentStroke.color, currentStroke.size);
        broadcastStroke(currentStroke.id, currentStroke.owner, lastPos.x, lastPos.y, pos.x, pos.y, currentStroke.color, currentStroke.size);
      }
      lastPos = pos;
    }
    function onPointerUp(){
      if (!isDrawing) return;
      isDrawing = false;
      lastPos = null;
      currentStroke = null;
      scheduleSnapshot();
    }
    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);

    function scheduleSnapshot(){
      if (snapshotTimer) clearTimeout(snapshotTimer);
      snapshotTimer = setTimeout(saveSnapshot, 1200);
    }
    function saveSnapshot(){
      if (!client || subActive) return; // 各自练习模式下画面是私人的，不能拿去覆盖共享白板的存档
      var dataUrl = canvas.toDataURL("image/png");
      client.from("live_board").upsert({ id:"current", version:boardVersion, snapshot:dataUrl, updated_at:new Date().toISOString() });
    }

    function loadImage(dataUrl, cb){
      if (!dataUrl){ boardBgImage = null; redrawBoard(); if (cb) cb(); return; }
      var img = new Image();
      img.onload = function(){ boardBgImage = img; redrawBoard(); if (cb) cb(); };
      img.onerror = function(){ if (cb) cb(); };
      img.src = dataUrl;
    }

    function updatePermissionUI(){
      toolbarEl.hidden = !drawingEnabled;
      viewonlyEl.hidden = drawingEnabled;
      if (!drawingEnabled){
        viewonlyEl.textContent = subActive
          ? "老师正在收集大家各自的练习，等老师授权你就能开始画自己的画板 👀"
          : "老师还没授权你绘图，你现在只能看 👀";
      }
      submitBtn.hidden = !(drawingEnabled && subActive);
      updateSubmitUI();
    }

    function updateSubmitUI(){
      if (!drawingEnabled || !subActive) return;
      submitBtn.classList.toggle("submitted", submitted);
      submitBtn.textContent = submitted ? "✅ 已提交（可再改再交）" : "📤 提交给老师";
      submitStatusEl.textContent = submitted ? "" : "写完记得按提交，老师才看得到你的画面～";
    }

    /* 每次跟服务器对齐状态时，只有版本真的变了（老师把统计图设成背景，或清空了画板）
       才会重置成新的「压平底图」，避免重复叠图，也避免让「只能擦自己的」失效。
       「各自练习」模式下不理会共享画板的版本号——只看 sub_round 有没有变，
       变了就表示老师开了新一轮，学生这边要清空重新开始。 */
    function applyRow(row){
      if (!row) return;
      allowedIds = Array.isArray(row.allowed_client_ids) ? row.allowed_client_ids : [];
      drawingEnabled = allowedIds.indexOf(myClientId) >= 0;
      var nowSubActive = !!row.sub_active;
      var nowSubRound = row.sub_round || 0;
      var subJustChanged = (nowSubActive !== subActive) || (nowSubRound !== subRound);
      subActive = nowSubActive;
      subRound = nowSubRound;
      updatePermissionUI();
      if (subActive){
        if (subJustChanged){
          boardStrokes = [];
          boardBgImage = null;
          currentStroke = null;
          submitted = false;
          redrawBoard();
          updateSubmitUI();
        }
        return;
      }
      var v = row.version || 0;
      if (!boardStateLoaded || v !== boardVersion){
        boardVersion = v;
        boardStrokes = [];
        boardStateLoaded = true;
        loadImage(row.snapshot);
      }
    }

    submitBtn.addEventListener("click", function(){
      if (!client || !drawingEnabled || !subActive) return;
      var dataUrl = canvas.toDataURL("image/png");
      submitStatusEl.textContent = "提交中…";
      client.from("board_submissions").upsert({
        round: subRound, client_id: myClientId, name: myName, snapshot: dataUrl, updated_at: new Date().toISOString()
      }).then(function(res){
        if (res.error){
          submitStatusEl.textContent = "";
          alert("❌ 提交失败：" + res.error.message + "\n\n很可能是 Supabase 还没建 board_submissions 表，请照页面开头注释里的 SQL 建表。");
        } else {
          submitted = true;
          updateSubmitUI();
        }
      });
    });

    document.querySelectorAll(".color").forEach(function(b){
      b.addEventListener("click", function(){
        erasing = false;
        document.getElementById("eraserBtn").classList.remove("active");
        document.querySelectorAll(".color").forEach(function(x){ x.classList.remove("active"); });
        b.classList.add("active");
        color = b.dataset.color;
      });
    });
    document.getElementById("eraserBtn").addEventListener("click", function(){
      erasing = !erasing;
      this.classList.toggle("active", erasing);
      document.querySelectorAll(".color").forEach(function(b){ b.classList.remove("active"); });
    });

    function startBoard(){
      nameGate.hidden = true;
      topbar.hidden = false;
      canvasWrap.hidden = false;
      meLabel.textContent = "· 你是「" + myName + "」";

      if (typeof window.supabase === "undefined"){
        statusEl.textContent = "连不上服务器，请检查网络后重新整理页面。";
        waitingEl.querySelector("span").textContent = "连不上服务器，请检查网络";
        return;
      }
      try {
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch(e){
        statusEl.textContent = "连不上服务器，请重新整理页面。";
        return;
      }
      client.from("live_board").select("*").eq("id","current").maybeSingle().then(function(res){
        waitingEl.hidden = true;
        if (res.data) applyRow(res.data);
        else updatePermissionUI();
        statusEl.textContent = "已连线"; statusEl.className = "status live";
      }).catch(function(){
        statusEl.textContent = "连线失败，请重新整理页面。";
      });

      channel = client.channel("board-live")
        .on("broadcast", { event:"stroke" }, function(msg){
          if (subActive) return; // 各自练习模式下不理会共享白板的画面
          var p = msg.payload;
          if (!p) return;
          var stroke = null;
          for (var i=0;i<boardStrokes.length;i++){ if (boardStrokes[i].id===p.strokeId){ stroke=boardStrokes[i]; break; } }
          if (!stroke){ stroke = { id:p.strokeId, owner:p.owner, color:p.color, size:p.size, pts:[{x:p.x0,y:p.y0}] }; boardStrokes.push(stroke); }
          stroke.pts.push({x:p.x1,y:p.y1});
          drawSegment(p.x0,p.y0,p.x1,p.y1,p.color,p.size);
        })
        .on("broadcast", { event:"eraseStroke" }, function(msg){
          if (subActive) return;
          var p = msg.payload;
          if (!p) return;
          for (var i=0;i<boardStrokes.length;i++){ if (boardStrokes[i].id===p.strokeId){ boardStrokes.splice(i,1); break; } }
          redrawBoard();
        })
        .on("broadcast", { event:"strokeUpdate" }, function(msg){
          // 老师画的直线/矩形/圆形，或者被老师拖动过位置的笔画，会整个一起同步过来
          if (subActive) return;
          var p = msg.payload;
          if (!p) return;
          var obj = { id:p.id, type:p.type, owner:p.owner, color:p.color, size:p.size, x1:p.x1, y1:p.y1, x2:p.x2, y2:p.y2, pts:p.pts };
          var idx = -1;
          for (var i=0;i<boardStrokes.length;i++){ if (boardStrokes[i].id===p.id){ idx=i; break; } }
          if (idx>=0) boardStrokes[idx] = obj; else boardStrokes.push(obj);
          redrawBoard();
        })
        .subscribe();

      client.channel("board-row-watch")
        .on("postgres_changes", { event:"UPDATE", schema:"public", table:"live_board", filter:"id=eq.current" }, function(payload){
          applyRow(payload.new);
        })
        .subscribe();

      presenceChannel = client.channel("board-presence", { config: { presence: { key: myClientId } } });
      presenceChannel.subscribe(function(status){
        if (status === "SUBSCRIBED") presenceChannel.track({ name: myName, client_id: myClientId });
      });
    }

    function tryStart(){
      var v = nameInput.value.trim();
      if (!v){ nameErr.textContent = "请输入名字再进入。"; return; }
      myName = v.slice(0, 12);
      try { localStorage.setItem(NAME_KEY, myName); } catch(e){}
      startBoard();
    }
    nameGoBtn.addEventListener("click", tryStart);
    nameInput.addEventListener("keydown", function(e){ if (e.key === "Enter") tryStart(); });

    /* 换名字：同一台设备给不同学生轮流用的时候，换人先换名字。
       换名字的时候也会换一个全新的身份 id，这样新同学不会「继承」上一个
       同学在老师那边被授权画图的状态，老师需要重新勾选授权。 */
    function leaveBoardConnections(){
      try { if (channel && client) client.removeChannel(channel); } catch(e){}
      try { if (presenceChannel && client) client.removeChannel(presenceChannel); } catch(e){}
      channel = null; presenceChannel = null; client = null;
      boardStrokes = []; boardBgImage = null; boardStateLoaded = false; boardVersion = 0;
      allowedIds = []; drawingEnabled = false; currentStroke = null; isDrawing = false;
      subActive = false; subRound = 0; submitted = false;
    }
    function switchName(){
      leaveBoardConnections();
      myName = "";
      myClientId = makeClientId();
      try {
        localStorage.removeItem(NAME_KEY);
        localStorage.setItem(CLIENT_KEY, myClientId);
      } catch(e){}
      topbar.hidden = true;
      toolbarEl.hidden = true;
      canvasWrap.hidden = true;
      viewonlyEl.hidden = true;
      waitingEl.hidden = false;
      statusEl.textContent = "正在连线…"; statusEl.className = "status";
      nameInput.value = "";
      nameErr.textContent = "";
      nameGate.hidden = false;
      nameInput.focus();
    }
    changeNameBtn.addEventListener("click", switchName);

    function init(){
      try {
        myClientId = localStorage.getItem(CLIENT_KEY) || "";
        if (!myClientId){ myClientId = makeClientId(); localStorage.setItem(CLIENT_KEY, myClientId); }
      } catch(e){ myClientId = makeClientId(); }

      var savedName = "";
      try { savedName = localStorage.getItem(NAME_KEY) || ""; } catch(e){}
      if (savedName){
        myName = savedName;
        startBoard();
      } else {
        nameInput.focus();
      }
    }

    init();
  })();
  </script>
</body>
</html>
