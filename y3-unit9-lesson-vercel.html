<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>单元九课堂手册</title>
<!--
  =====================================================================
  这是「教师课堂手册」的 Vercel 部署版，跟 y3-unit9-vote.html（学生举手
  统计作答页）、y3-unit9-board.html（学生共享白板页）配套使用。

  为什么需要这个版本？
  Claude 网页版发布的手册链接（Artifact）安全限制比较严格，页面里可以
  加载 Supabase 的程式库，但是没办法真正连线到 Supabase 服务器发送/
  接收资料，所以「举手统计」「共享白板」这两个按钮在 Artifact 版本里
  是打不开、连不上的。把手册也放到 Vercel（一般网页，没有这层限制），
  这两个功能才能真正连上 Supabase、跟学生实时互动。

  部署方式：跟 index.html、y3-unit9-vote.html、y3-unit9-board.html 放在
  同一个 GitHub 仓库根目录下，一起推上 Vercel，网址就会是
  你的网址.vercel.app/y3-unit9-lesson-vercel.html
  —— 老师上课时改用这个网址打开手册（而不是 Claude 的 Artifact 链接），
  「举手统计」和「共享白板」才会生效。手册本身内容（16 页教具、各种练习
  题）完全一样，这个版本只是多了这两个功能能正常运作。

  共享白板需要额外建一张 Supabase 表（SQL、RLS、GRANT 语句、Realtime
  设置说明都写在 y3-unit9-board.html 文件最上面的注释里，请照着跑一遍）。

  【2026-08 更新：白板改成「按学生授权」】
  白板不再是「全班一起画 / 全班都不能画」的开关，改成老师在白板面板里
  看到一份实时更新的在线学生名单（学生进入 y3-unit9-board.html 前要先
  输入名字），老师勾选某个学生，才授权那个学生画，其他学生只能看。
  这需要把 live_board 表加一个新字段，如果你的 Supabase 项目是照旧版
  说明建的表（只有 drawing_enabled 字段），请在 SQL Editor 再跑一次：
    alter table live_board add column if not exists
      allowed_client_ids jsonb not null default '[]'::jsonb;
  旧的 drawing_enabled 字段留着不影响，可以之后手动删除，不删也没关系。
  =====================================================================
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&family=Fredoka:wght@500;700&display=swap');

  :root{
    --bg:#FFF6E9; --bg-soft:#FFEFD6; --panel:#FFFFFF; --ink:#2B2A33; --ink-soft:#6B6879;
    --line:#EFE2CC; --primary:#FF6B4A; --primary-ink:#7A2A18; --secondary:#2EC4B6;
    --secondary-ink:#0B4A45; --accent:#FFC93C; --accent-ink:#6B4A00; --wrong:#E63950;
    --wrong-bg:#FFE3E7; --correct-bg:#DFF7EE; --shadow:0 10px 24px -12px rgba(43,42,51,.28);
    --sidebar-bg:#FBEEDA; --c1:#FF6B4A; --c2:#2EC4B6; --c3:#FFC93C; --c4:#7B7FE8; --c5:#F76BA8;
  }
  /* 教具固定使用浅色主题，不跟随系统深色模式，避免投影时颜色不一致 */
  :root[data-theme="dark"]{
    --bg:#1C1B22; --bg-soft:#26242E; --panel:#2A2833; --ink:#F3EFE6; --ink-soft:#B7B2C4;
    --line:#3A3745; --primary:#FF8266; --primary-ink:#FFE7DF; --secondary:#3FDFCF;
    --secondary-ink:#08221F; --accent:#FFD666; --accent-ink:#3A2900; --wrong:#FF6B7F;
    --wrong-bg:#3A2229; --correct-bg:#163229; --shadow:0 10px 26px -12px rgba(0,0,0,.55);
    --sidebar-bg:#221F29;
  }

  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); min-height:100vh; font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .display{ font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif; }
  .num{ font-family:"Fredoka","Noto Sans SC",sans-serif; font-variant-numeric:tabular-nums; }
  button{ font:inherit; color:inherit; }

  .shell{ display:flex; min-height:100vh; }
  .sidebar{ width:270px; flex:none; background:var(--sidebar-bg); border-right:1px solid var(--line); padding:18px 14px; overflow-y:auto; max-height:100vh; position:sticky; top:0; }
  .sb-brand{ display:flex; align-items:center; gap:10px; padding:4px 4px 16px; }
  .sb-badge{ width:38px; height:38px; border-radius:12px; flex:none; background:linear-gradient(155deg, var(--primary), var(--accent)); display:flex; align-items:center; justify-content:center; font-size:19px; box-shadow:var(--shadow); }
  .sb-title{ font-family:"ZCOOL KuaiLe",sans-serif; font-size:16.5px; line-height:1.25; }
  .sb-sub{ font-size:11px; color:var(--ink-soft); font-weight:700; letter-spacing:.04em; }
  .sb-section-title{ font-size:12px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; padding:10px 8px 4px; }
  .sb-item{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:12px; cursor:pointer; font-size:13.5px; color:var(--ink); margin-bottom:2px; }
  .sb-item:hover{ background:var(--bg-soft); }
  .sb-item.active{ background:var(--primary); color:#fff; font-weight:700; }
  .sb-num{ width:20px; height:20px; border-radius:50%; background:var(--panel); color:var(--ink-soft); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; }
  .sb-item.active .sb-num{ background:rgba(255,255,255,.3); color:#fff; }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 24px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; }
  .crumb{ font-size:13px; color:var(--ink-soft); font-weight:700; }
  .crumb b{ color:var(--primary-ink); }
  .menu-toggle{ display:none; align-items:center; justify-content:center; width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--panel); cursor:pointer; font-size:16px; }
  .stage-toggle{ display:flex; align-items:center; gap:8px; background:var(--bg-soft); border:1px solid var(--line); border-radius:999px; padding:7px 14px 7px 8px; cursor:pointer; font-size:13px; font-weight:700; color:var(--ink-soft); }
  .stage-toggle .dot{ width:28px; height:16px; border-radius:999px; background:var(--line); position:relative; flex:none; }
  .stage-toggle .dot::after{ content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:var(--panel); box-shadow:0 1px 3px rgba(0,0,0,.3); transition:left .18s ease; }
  .stage-toggle.on .dot{ background:var(--primary); } .stage-toggle.on{ color:var(--ink); } .stage-toggle.on .dot::after{ left:14px; }

  .content{ flex:1; padding:26px 28px 40px; max-width:980px; width:100%; margin:0 auto; }
  .slide-tag{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:var(--primary-ink); background:color-mix(in srgb, var(--primary) 14%, var(--panel)); padding:4px 12px; border-radius:999px; margin-bottom:10px; }
  .slide-title{ font-family:"ZCOOL KuaiLe",sans-serif; font-size:clamp(22px,3.4vw,30px); margin:0 0 8px; text-wrap:balance; }
  .slide-goal{ font-size:14.5px; color:var(--ink-soft); margin:0; }
  .tip-toggle{ display:inline-flex; align-items:center; gap:6px; margin-top:10px; font-size:13px; font-weight:700; color:var(--secondary-ink); background:color-mix(in srgb, var(--secondary) 16%, var(--panel)); border:none; padding:7px 13px; border-radius:999px; cursor:pointer; }
  .tip-panel{ display:none; margin-top:10px; background:color-mix(in srgb, var(--secondary) 8%, var(--panel)); border:1px dashed color-mix(in srgb, var(--secondary) 45%, var(--line)); border-radius:14px; padding:12px 16px; font-size:13.5px; color:var(--ink); line-height:1.7; }
  .tip-panel.show{ display:block; }
  .tip-panel .std{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; font-weight:700; }

  .stage{ background:var(--panel); border:1px solid var(--line); border-radius:24px; padding:clamp(20px,3.6vw,36px); margin-top:18px; box-shadow:var(--shadow); min-height:300px; display:flex; flex-direction:column; gap:20px; align-items:center; justify-content:center; text-align:center; }
  .instr{ color:var(--ink-soft); font-size:15px; margin:0; max-width:620px; }
  .feedback{ min-height:28px; font-weight:800; font-size:16px; }
  .feedback.ok{ color:var(--secondary-ink); } .feedback.no{ color:var(--wrong); }
  .choices{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; }
  .choice{ min-width:64px; padding:13px 20px; border-radius:16px; border:2px solid var(--line); background:var(--bg-soft); font-weight:800; font-size:20px; cursor:pointer; transition:transform .12s ease, border-color .12s ease; }
  .choice:hover{ transform:translateY(-2px); border-color:var(--primary); }
  .choice.small{ font-size:15px; font-weight:700; padding:11px 16px; max-width:300px; }
  .choice.correct{ background:var(--correct-bg); border-color:var(--secondary); }
  .choice.wrong{ background:var(--wrong-bg); border-color:var(--wrong); }
  .choice[disabled]{ cursor:default; opacity:.85; }
  .redo{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px; padding:9px 18px; font-weight:800; font-size:13.5px; cursor:pointer; box-shadow:var(--shadow); }

  .tree{ display:flex; flex-direction:column; align-items:center; gap:6px; font-size:14px; }
  .tree-root{ font-weight:800; background:var(--bg-soft); border:1px solid var(--line); border-radius:12px; padding:6px 16px; }
  .tree-branches{ display:flex; gap:22px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  .tree-branch{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .tree-branch .cat{ font-weight:800; color:var(--primary-ink); background:color-mix(in srgb, var(--primary) 14%, var(--panel)); border-radius:999px; padding:5px 14px; font-size:13.5px; }
  .tree-branch .items{ font-size:12.5px; color:var(--ink-soft); max-width:140px; text-align:center; }

  .freq-table{ display:flex; flex-direction:column; gap:8px; width:100%; max-width:440px; }
  .freq-row{ display:grid; grid-template-columns:76px 1fr 40px; align-items:center; gap:10px; border-bottom:1px dashed var(--line); padding-bottom:7px; }
  .freq-label{ font-weight:800; font-size:14px; text-align:right; }
  .freq-checks{ display:flex; flex-wrap:wrap; gap:3px; font-size:15px; color:var(--secondary-ink); }
  .freq-count{ font-weight:800; text-align:center; }

  .pg-table{ display:flex; flex-direction:column; gap:10px; align-items:stretch; width:100%; max-width:560px; }
  .pg-row{ display:flex; align-items:center; gap:12px; border-bottom:1px dashed var(--line); padding-bottom:8px; }
  .pg-label{ width:84px; flex:none; font-weight:800; font-size:14px; text-align:right; }
  .pg-icons{ display:flex; flex-wrap:wrap; gap:4px; font-size:22px; }
  .pg-key{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; }

  .bar-chart{ display:flex; align-items:flex-end; gap:18px; height:180px; padding:0 10px; }
  .bar-col{ display:flex; flex-direction:column; align-items:center; gap:6px; justify-content:flex-end; height:100%; }
  .bar-rect{ width:38px; border-radius:8px 8px 0 0; }
  .bar-rect.missing{ background:repeating-linear-gradient(45deg, var(--line), var(--line) 6px, transparent 6px, transparent 12px) !important; border:2px dashed var(--ink-soft); }
  .bar-label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); }

  .pie-wrap{ display:flex; gap:22px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .pie{ width:170px; height:170px; border-radius:50%; }
  .pie-legend{ display:flex; flex-direction:column; gap:8px; text-align:left; font-size:13.5px; }
  .pie-legend .row{ display:flex; align-items:center; gap:8px; }
  .pie-swatch{ width:14px; height:14px; border-radius:4px; flex:none; }

  .chart-trio{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; align-items:flex-start; }
  .chart-card{ background:var(--bg-soft); border:1px solid var(--line); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:170px; }
  .chart-card h4{ margin:0; font-size:12.5px; font-weight:800; color:var(--primary-ink); }

  .vocab-table{ width:100%; max-width:640px; border-collapse:collapse; text-align:left; }
  .vocab-table th, .vocab-table td{ border:1px solid var(--line); padding:9px 14px; font-size:14px; }
  .vocab-table th{ background:var(--bg-soft); font-weight:800; }

  .shape-table{ width:100%; max-width:280px; border-collapse:collapse; text-align:left; }
  .shape-table th, .shape-table td{ border:1px solid var(--line); padding:8px 12px; font-size:13.5px; }
  .shape-table th{ background:var(--bg-soft); font-weight:800; }
  .shape-tables{ display:flex; gap:24px; flex-wrap:wrap; justify-content:center; }

  .stem-imgrow{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:40px; }
  .stem-card{ background:var(--bg-soft); border:1px solid var(--line); border-radius:14px; padding:14px 18px; font-size:13.5px; max-width:220px; }
  .coin-row{ display:flex; flex-wrap:wrap; gap:4px; justify-content:center; font-size:22px; max-width:480px; }
  .coin-emoji{ display:inline-block; animation:coinpop .25s ease; }
  @keyframes coinpop{ from{ transform:scale(0.4); opacity:0; } to{ transform:scale(1); opacity:1; } }

  .word-problem{ text-align:left; max-width:600px; }
  .word-problem .q{ font-size:15.5px; font-weight:700; margin-bottom:12px; }
  .step{ display:flex; gap:10px; align-items:flex-start; margin-bottom:9px; }
  .step .k{ flex:none; font-size:12px; font-weight:800; padding:4px 9px; border-radius:999px; color:#fff; }
  .step .k.s1{ background:#5AC8FA; } .step .k.s2{ background:#FF9F43; } .step .k.s3{ background:var(--secondary); } .step .k.s4{ background:#A78BFA; }
  .step .v{ font-size:14px; padding-top:2px; }

  .footer-nav{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 28px 26px; max-width:980px; width:100%; margin:0 auto; }
  .nav-btn{ display:inline-flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:11px 20px; font-weight:800; font-size:14px; cursor:pointer; box-shadow:var(--shadow); }
  .nav-btn:hover{ background:var(--bg-soft); }
  .nav-btn[disabled]{ opacity:.4; cursor:default; }
  .nav-btn.primary{ background:var(--primary); color:#fff; border-color:transparent; }
  .progress-txt{ font-size:13px; font-weight:800; color:var(--ink-soft); }

  body.stage-mode .slide-title{ font-size:clamp(26px,4.2vw,36px); }
  body.stage-mode .instr{ font-size:18px; }
  body.stage-mode .choice{ font-size:26px; padding:16px 24px; }
  body.stage-mode .choice.small{ font-size:17px; }
  body.stage-mode .feedback{ font-size:19px; }
  body.stage-mode .pg-icons{ font-size:28px; }

  .choice.selected{ background:color-mix(in srgb, var(--secondary) 22%, var(--panel)); border-color:var(--secondary); }

  .numpad-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .numpad-display{ font-family:"Fredoka","Noto Sans SC",sans-serif; font-size:32px; font-weight:800; min-width:120px; text-align:center; padding:10px 22px; border-radius:16px; border:2px solid var(--line); background:var(--bg-soft); }
  .numpad-display.ok{ background:var(--correct-bg); border-color:var(--secondary); }
  .numpad-display.no{ background:var(--wrong-bg); border-color:var(--wrong); }
  .numpad-grid{ display:grid; grid-template-columns:repeat(3,64px); gap:10px; }
  .numpad-key{ padding:14px 0; border-radius:14px; border:2px solid var(--line); background:var(--panel); font-weight:800; font-size:20px; cursor:pointer; }
  .numpad-key:hover{ border-color:var(--primary); }
  .numpad-key.go{ background:var(--primary); color:#fff; border-color:transparent; }
  .numpad-key[disabled]{ opacity:.6; cursor:default; }

  .dragblank-wrap{ display:flex; flex-direction:column; align-items:center; gap:18px; width:100%; }
  .dragblank-slots{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .dragblank-col{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .dragblank-caption{ font-size:12.5px; color:var(--ink-soft); font-weight:700; max-width:110px; text-align:center; }
  .drag-slot{ min-width:64px; min-height:46px; border:2px dashed var(--line-strong,var(--line)); border-radius:14px; background:var(--bg-soft); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px; cursor:pointer; padding:6px 10px; }
  .drag-slot.filled{ border-style:solid; background:var(--panel); }
  .drag-slot.correct{ border-color:var(--secondary); background:var(--correct-bg); }
  .drag-slot.wrong{ border-color:var(--wrong); background:var(--wrong-bg); }
  .dragblank-pool{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; padding-top:6px; border-top:1px dashed var(--line); }
  .drag-chip{ padding:10px 16px; border-radius:12px; border:2px solid var(--line); background:var(--panel); font-weight:800; font-size:16px; cursor:grab; touch-action:none; user-select:none; }
  .drag-chip.selected{ border-color:var(--primary); background:color-mix(in srgb, var(--primary) 14%, var(--panel)); }
  .drag-chip.used{ opacity:.3; cursor:default; }
  .drag-chip.dragging{ opacity:.3; }
  .drag-ghost{ position:fixed; pointer-events:none; z-index:1000; transform:translate(-50%,-50%); opacity:.9; box-shadow:var(--shadow); }

  .poll-btn{ display:inline-flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-weight:700; font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .poll-btn:hover{ background:var(--bg-soft); }
  .poll-overlay{ position:fixed; inset:0; background:rgba(20,20,25,.45); display:none; align-items:center; justify-content:center; z-index:200; padding:20px; }
  .poll-overlay.show{ display:flex; }
  .poll-panel{ background:var(--panel); border-radius:22px; box-shadow:var(--shadow); padding:24px 26px; max-width:460px; width:100%; max-height:86vh; overflow-y:auto; }
  .poll-panel h3{ font-family:"ZCOOL KuaiLe",sans-serif; font-size:19px; margin:0 0 10px; }
  .poll-q{ font-size:14.5px; font-weight:700; margin-bottom:10px; }
  .poll-opts{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .poll-opt-row{ display:flex; align-items:center; gap:10px; }
  .poll-opt-label{ flex:0 0 96px; font-size:13.5px; font-weight:700; }
  .poll-bar-track{ flex:1; height:22px; border-radius:11px; background:var(--bg-soft); overflow:hidden; }
  .poll-bar-fill{ height:100%; background:var(--secondary); border-radius:11px; transition:width .3s ease; }
  .poll-count{ flex:0 0 30px; text-align:right; font-weight:800; font-size:13px; }
  .poll-actions{ display:flex; gap:10px; justify-content:flex-end; }
  .poll-total{ font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; }
  .poll-empty{ font-size:13.5px; color:var(--ink-soft); text-align:center; padding:20px 0; }
  .poll-close{ background:var(--bg-soft); border:1px solid var(--line); border-radius:999px; padding:9px 16px; font-weight:700; font-size:13px; cursor:pointer; }
  .poll-send{ background:var(--primary); color:#fff; border:none; border-radius:999px; padding:9px 18px; font-weight:800; font-size:13px; cursor:pointer; }

  .board-panel{ max-width:720px; }
  .board-toolbar{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .board-colors{ display:flex; align-items:center; gap:8px; }
  .board-color{ width:26px; height:26px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0; }
  .board-color.active{ border-color:var(--ink); box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--ink); }
  .board-eraser{ background:var(--bg-soft); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-weight:700; font-size:12.5px; cursor:pointer; }
  .board-eraser.active{ background:var(--primary); color:#fff; border-color:transparent; }
  .board-actions-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .board-mini-btn{ background:var(--bg-soft); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-weight:700; font-size:12.5px; cursor:pointer; }
  .board-mini-btn:hover{ background:var(--line); }
  .board-mini-btn.active{ background:var(--primary); color:#fff; border-color:transparent; }
  .board-canvas-wrap{ position:relative; border:2px solid var(--line); border-radius:16px; overflow:hidden; background:#fff; }
  .board-canvas-wrap canvas{ display:block; width:100%; height:auto; touch-action:none; cursor:crosshair; }
  .board-viewonly{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.75); font-weight:800; font-size:15px; color:var(--ink-soft); text-align:center; padding:20px; }

<script>
(function(){
"use strict";
function $(id){ return document.getElementById(id); }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t;} return a; }
function distinctInts(n, lo, hi){ var pool=[]; for (var v=lo; v<=hi; v++) pool.push(v); return shuffle(pool).slice(0,n); }
function pickN(arr,n){ return shuffle(arr).slice(0,n); }
function clearEl(el){ while(el.firstChild) el.removeChild(el.firstChild); }
function el(tag,cls,text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
var COLORS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];

function makeChoiceRow(container, options, correctValue, onDone, cls){
  var row = el("div","choices"); var answered=false;
  options.forEach(function(v){
    var b = el("button", cls || "choice", String(v)); b.type="button";
    b.addEventListener("click", function(){
      if (answered) return; answered=true;
      row.querySelectorAll(".choice").forEach(function(x){ x.disabled=true; });
      var ok = (v===correctValue);
      b.classList.add(ok?"correct":"wrong");
      if(!ok){ row.querySelectorAll(".choice").forEach(function(x){ if(x.textContent==String(correctValue)) x.classList.add("correct"); }); }
      onDone(ok);
    });
    row.appendChild(b);
  });
  container.appendChild(row);
  return row;
}
function uniqueOptionsAround(correct,count,lo,hi,spread){
  var set=new Set([correct]); var guard=0;
  while(set.size<count && guard<300){ guard++; var v=correct+randInt(-spread,spread); if(v>=lo && v<=hi) set.add(v); }
  return shuffle(Array.from(set));
}
function feedbackText(elx, ok, okMsg, noMsg){ elx.textContent = ok ? (okMsg||"🎉 答对了！") : (noMsg||"再想想看～"); elx.className="feedback "+(ok?"ok":"no"); }
function addRedo(stage, fn){ var b=el("button","redo","🔄 再出一题"); b.type="button"; b.addEventListener("click", fn); stage.appendChild(b); return b; }

/* ---- 多选题：勾选一个以上答案再提交 ---- */
function makeMultiSelect(container, options, correctSet, onDone){
  var wrap = el("div","multi-wrap");
  var row = el("div","choices");
  var selected = {};
  options.forEach(function(opt){
    var b = el("button","choice small", opt); b.type="button";
    b.addEventListener("click", function(){
      if (wrap.classList.contains("answered")) return;
      selected[opt] = !selected[opt];
      b.classList.toggle("selected", !!selected[opt]);
    });
    row.appendChild(b);
  });
  wrap.appendChild(row);
  var hint = el("div","instr","☝️ 可以勾选一个以上的答案，选好后按「提交答案」。");
  hint.style.fontSize = "12.5px";
  wrap.appendChild(hint);
  var submitBtn = el("button","redo","✅ 提交答案"); submitBtn.type="button";
  submitBtn.addEventListener("click", function(){
    if (wrap.classList.contains("answered")) return;
    wrap.classList.add("answered");
    var chosen = options.filter(function(o){ return selected[o]; });
    var correctArr = correctSet.slice().sort();
    var chosenArr = chosen.slice().sort();
    var ok = correctArr.length===chosenArr.length && correctArr.every(function(v,i){ return v===chosenArr[i]; });
    row.querySelectorAll(".choice").forEach(function(b){
      b.disabled = true;
      var isCorrect = correctSet.indexOf(b.textContent)>=0;
      var isChosen = chosen.indexOf(b.textContent)>=0;
      if (isCorrect) b.classList.add("correct");
      else if (isChosen) b.classList.add("wrong");
    });
    onDone(ok);
  });
  wrap.appendChild(submitBtn);
  container.appendChild(wrap);
  return wrap;
}

/* ---- 数字键盘输入：不给选项，自己按数字作答 ---- */
function makeNumberPad(container, correctValue, onDone){
  var wrap = el("div","numpad-wrap");
  var display = el("div","numpad-display","＿");
  wrap.appendChild(display);
  var value = "";
  function render(){ display.textContent = value.length ? value : "＿"; }
  var grid = el("div","numpad-grid");
  function submit(){
    if (wrap.classList.contains("answered") || !value.length) return;
    wrap.classList.add("answered");
    var num = Number(value);
    var ok = num === correctValue;
    display.classList.add(ok ? "ok" : "no");
    grid.querySelectorAll(".numpad-key").forEach(function(b){ b.disabled = true; });
    onDone(ok, num);
  }
  ["1","2","3","4","5","6","7","8","9","⌫","0","✓"].forEach(function(k){
    var b = el("button","numpad-key", k); b.type="button";
    if (k==="✓") b.classList.add("go");
    b.addEventListener("click", function(){
      if (wrap.classList.contains("answered")) return;
      if (k==="⌫"){ value = value.slice(0,-1); render(); return; }
      if (k==="✓"){ submit(); return; }
      if (value.length>=5) return;
      value += k; render();
    });
    grid.appendChild(b);
  });
  wrap.appendChild(grid);
  container.appendChild(wrap);
  return wrap;
}

/* ---- 拖拽题：把卡片拖（或点选后再点目标）放进格子里，也可用来做排序题 ---- */
function makeDragBlank(container, tokens, blanks, onDone){
  var wrap = el("div","dragblank-wrap");
  var blankRow = el("div","dragblank-slots");
  var slotEls = {};
  var chipEls = {};
  var selectedChip = null;

  function placeToken(chip, slot){
    if (selectedChip===chip){ selectedChip.classList.remove("selected"); selectedChip=null; }
    slot.dataset.filled = chip.dataset.tokenId;
    slot.textContent = chip.textContent;
    slot.classList.add("filled");
    chip.classList.add("used");
  }

  blanks.forEach(function(b){
    var slot = el("div","drag-slot","");
    slot.dataset.blankId = b.id;
    slot.dataset.filled = "";
    slotEls[b.id] = slot;
    slot.addEventListener("click", function(){
      if (wrap.classList.contains("answered")) return;
      if (slot.dataset.filled){
        var tokId = slot.dataset.filled;
        var chip = chipEls[tokId];
        if (chip) chip.classList.remove("used");
        slot.dataset.filled = "";
        slot.textContent = "";
        slot.classList.remove("filled");
      } else if (selectedChip){
        placeToken(selectedChip, slot);
      }
    });
    if (b.label){
      var col = el("div","dragblank-col");
      col.appendChild(el("div","dragblank-caption", b.label));
      col.appendChild(slot);
      blankRow.appendChild(col);
    } else {
      blankRow.appendChild(slot);
    }
  });
  wrap.appendChild(blankRow);

  var pool = el("div","dragblank-pool");
  shuffle(tokens).forEach(function(t){
    var chip = el("div","drag-chip", t.label);
    chip.dataset.tokenId = t.id;
    chipEls[t.id] = chip;
    chip.addEventListener("click", function(){
      if (wrap.classList.contains("answered") || chip.classList.contains("used")) return;
      if (selectedChip === chip){ chip.classList.remove("selected"); selectedChip = null; return; }
      if (selectedChip) selectedChip.classList.remove("selected");
      selectedChip = chip; chip.classList.add("selected");
    });
    chip.addEventListener("pointerdown", function(e){
      if (wrap.classList.contains("answered") || chip.classList.contains("used")) return;
      var startX=e.clientX, startY=e.clientY, moved=false, ghost=null;
      function onMove(ev){
        var dx=ev.clientX-startX, dy=ev.clientY-startY;
        if (!moved && Math.hypot(dx,dy)>6){
          moved = true;
          ghost = chip.cloneNode(true);
          ghost.className = "drag-chip drag-ghost";
          document.body.appendChild(ghost);
          chip.classList.add("dragging");
        }
        if (moved && ghost){ ghost.style.left = ev.clientX+"px"; ghost.style.top = ev.clientY+"px"; }
      }
      function onUp(ev){
        document.removeEventListener("pointermove", onMove);
        chip.classList.remove("dragging");
        if (ghost) ghost.remove();
        if (moved){
          var target = document.elementFromPoint(ev.clientX, ev.clientY);
          var slot = target && target.closest ? target.closest(".drag-slot") : null;
          if (slot && !slot.dataset.filled) placeToken(chip, slot);
        }
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp, {once:true});
    });
    pool.appendChild(chip);
  });
  wrap.appendChild(pool);

  var hint = el("div","instr","☝️ 用手指把下面的卡片拖到上面对应的格子里，也可以先点一下卡片、再点格子。");
  hint.style.fontSize = "12.5px"; hint.style.order = "-1";
  wrap.insertBefore(hint, blankRow);

  var submitBtn = el("button","redo","✅ 提交答案"); submitBtn.type="button";
  submitBtn.addEventListener("click", function(){
    if (wrap.classList.contains("answered")) return;
    var allFilled = blanks.every(function(b){ return !!slotEls[b.id].dataset.filled; });
    if (!allFilled) return;
    wrap.classList.add("answered");
    var ok = true;
    blanks.forEach(function(b){
      var slot = slotEls[b.id];
      var correct = slot.dataset.filled === b.correct;
      if (!correct) ok = false;
      slot.classList.add(correct ? "correct" : "wrong");
    });
    onDone(ok);
  });
  wrap.appendChild(submitBtn);

  container.appendChild(wrap);
  return wrap;
}

function renderTree(container, root, groups){
  var tree = el("div","tree");
  tree.appendChild(el("div","tree-root",root));
  var branches = el("div","tree-branches");
  groups.forEach(function(g){
    var b = el("div","tree-branch");
    b.appendChild(el("div","cat",g.cat));
    b.appendChild(el("div","items",g.items));
    branches.appendChild(b);
  });
  tree.appendChild(branches);
  container.appendChild(tree);
}
function renderFreqTable(container, categories){
  var wrap = el("div","freq-table");
  var head = el("div","freq-row");
  head.appendChild(el("div","freq-label","食物"));
  head.appendChild(el("div","","记录"));
  head.appendChild(el("div","freq-count","人数"));
  head.style.borderBottom = "2px solid var(--line)";
  wrap.appendChild(head);
  categories.forEach(function(c){
    var row = el("div","freq-row");
    row.appendChild(el("div","freq-label", c.label));
    var checks = el("div","freq-checks");
    for (var i=0;i<c.count;i++) checks.appendChild(el("span","","✓"));
    row.appendChild(checks);
    row.appendChild(el("div","freq-count num", String(c.count)));
    wrap.appendChild(row);
  });
  container.appendChild(wrap);
}
function renderPictogram(container, categories, scale, icon){
  var wrap = el("div","pg-table");
  categories.forEach(function(c){
    var row = el("div","pg-row");
    row.appendChild(el("div","pg-label", c.label));
    var icons = el("div","pg-icons");
    var count = Math.round(c.count/scale);
    for (var i=0;i<count;i++) icons.appendChild(el("span","",icon));
    row.appendChild(icons);
    wrap.appendChild(row);
  });
  container.appendChild(wrap);
  container.appendChild(el("div","pg-key", icon + " 代表 " + scale + " 个"));
}
function renderBarChart(container, categories, missingIdx){
  var max = Math.max.apply(null, categories.map(function(c){return c.count;}));
  var chart = el("div","bar-chart");
  categories.forEach(function(c,i){
    var col = el("div","bar-col");
    var rect = el("div","bar-rect");
    var isMissing = (missingIdx===i);
    rect.style.height = isMissing ? "96px" : (Math.round((c.count/max)*130+6)+"px");
    if (isMissing){ rect.classList.add("missing"); } else { rect.style.background = COLORS[i%COLORS.length]; }
    var val = el("div","bar-label num", isMissing ? "?" : String(c.count));
    col.appendChild(val); col.appendChild(rect); col.appendChild(el("div","bar-label", c.label));
    chart.appendChild(col);
  });
  container.appendChild(chart);
}
function renderPieChart(container, categories, hideValues){
  var total = categories.reduce(function(s,c){return s+c.count;},0);
  var acc=0;
  var stops = categories.map(function(c,i){ var start=acc/total*360; acc+=c.count; var end=acc/total*360; return COLORS[i%COLORS.length]+" "+start.toFixed(1)+"deg "+end.toFixed(1)+"deg"; }).join(", ");
  var wrap = el("div","pie-wrap");
  var pie = el("div","pie"); pie.style.background = "conic-gradient("+stops+")";
  var legend = el("div","pie-legend");
  categories.forEach(function(c,i){
    var row = el("div","row");
    var sw = el("div","pie-swatch"); sw.style.background=COLORS[i%COLORS.length];
    row.appendChild(sw); row.appendChild(el("span","", hideValues ? c.label : (c.label+"："+c.count)));
    legend.appendChild(row);
  });
  wrap.appendChild(pie); wrap.appendChild(legend);
  container.appendChild(wrap);
  return total;
}

/* ============ SLIDE KIND RENDERERS（依据课本第105-116页顺序） ============ */

function kindIntro(stage){
  clearEl(stage);
  stage.appendChild(el("p","instr","本单元以「开一家健康餐厅」为情境：调查顾客喜欢的食物、整理成统计表和统计图，再选出健康餐盘的菜单。"));
  var row = el("div","stem-imgrow","🍱 🧑‍🍳 👩‍🍳");
  stage.appendChild(row);
  var card = el("div","stem-card","讨论：你到餐厅通常会点什么食物？如果要帮全班同学做「健康餐盘」调查，可以怎样收集资料？");
  stage.appendChild(card);
}

function kindClassifyIntro(stage){
  var GROUPS = [
    {cat:"米饭", items:"炒饭、五谷粥、糙米饭、饭团"},
    {cat:"面条", items:"炒米粉、板面"},
    {cat:"面包", items:"三明治、全麦面包"}
  ];
  function build(){
    clearEl(stage);
    stage.appendChild(el("p","instr","第一步：把资料进行分类。第二步：用记数符号「✓」把顾客点的食物记录下来，整理成统计表。"));
    renderTree(stage, "顾客会点的食物", GROUPS);
    var counts0 = distinctInts(GROUPS.length, 2, 9);
    var cats = GROUPS.map(function(g,i){ return {label:g.cat, count: counts0[i]}; });
    renderFreqTable(stage, cats);
    var sorted = cats.slice().sort(function(a,b){return b.count-a.count;});

function initPoll(){

    $("pollBtn").hidden = false;

       如果不先跟服务器上次用到的版本号对齐，重新整理后发的下一题很可能又用回
       学生设备已经答过的旧版本号，学生那边就会一直显示「你已经提交过了」。 */
    pollClient.from("live_poll").select("version").eq("id","current").maybeSingle().then(function(res){

function scrapeCurrentQuestion(){

  var optEls = document.querySelectorAll("#stage .choices .choice");
  var opts = Array.prototype.map.call(optEls, function(b){ return b.textContent; });
  return { question: qText, options: opts };
}

function openPollPanel(){
  $("pollOverlay").classList.add("show");
  var scraped = scrapeCurrentQuestion();
  var body = $("pollBody");
  clearEl(body);
  if (!scraped.options.length){
    body.appendChild(el("div","poll-empty","当前这一页没有选择题选项（数字键盘、拖拽题暂不支持举手统计），请切换到有选项的题目再试一次。"));
    return;
  }
  body.appendChild(el("div","poll-q", scraped.question || "（本题）"));
  body.appendChild(el("div","poll-total","学生打开「举手统计」网址后会看到这一题，点选后老师这边会实时看到统计结果。"));
  var sendBtn = el("button","poll-send","🚀 发送给学生作答"); sendBtn.type="button";
  sendBtn.addEventListener("click", function(){ sendPoll(scraped); });
  var actionRow = el("div","poll-actions"); actionRow.appendChild(sendBtn);
  body.appendChild(actionRow);
}

function sendPoll(scraped){
  if (!pollClient) return;
  pollVersion += 1;
  var thisVersion = pollVersion;
  var body = $("pollBody");
  clearEl(body);
  body.appendChild(el("div","poll-q", scraped.question || "（本题）"));
  var tally = {}; scraped.options.forEach(function(o){ tally[o]=0; });
  var rowEls = {};
  var barsWrap = el("div","poll-opts");
  scraped.options.forEach(function(o){
    var row = el("div","poll-opt-row");
    row.appendChild(el("div","poll-opt-label", o));
    var track = el("div","poll-bar-track");
    var fill = el("div","poll-bar-fill",""); fill.style.width="0%";
    track.appendChild(fill);
    row.appendChild(track);
    var count = el("div","poll-count","0");
    row.appendChild(count);
    rowEls[o] = {fill:fill, count:count};
    barsWrap.appendChild(row);
  });
  body.appendChild(barsWrap);
  var totalEl = el("div","poll-total","正在发送给学生…");
  body.appendChild(totalEl);

  function renderTally(){
    var total = 0; Object.keys(tally).forEach(function(k){ total += tally[k]; });
    var max = 1; Object.keys(tally).forEach(function(k){ if (tally[k]>max) max=tally[k]; });
    Object.keys(tally).forEach(function(o){
      var pct = Math.round(tally[o]/max*100);
      if (rowEls[o]){ rowEls[o].fill.style.width = pct+"%"; rowEls[o].count.textContent = String(tally[o]); }
    });
    totalEl.textContent = "已提交："+total+" 人";
  }

  pollClient.from("live_poll").upsert({ id:"current", version:thisVersion, question:scraped.question, options:scraped.options, updated_at:new Date().toISOString() }).then(function(res){
    if (res.error){ totalEl.textContent = "发送失败："+res.error.message; return; }
    if (pollChannel){ pollClient.removeChannel(pollChannel); }
    renderTally();
    pollChannel = pollClient.channel("live-votes-"+thisVersion)
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"live_votes", filter:"version=eq."+thisVersion }, function(payload){
        var choice = payload.new && payload.new.choice;
        if (choice && tally.hasOwnProperty(choice)){ tally[choice] += 1; renderTally(); }
      })
      .subscribe();
  }).catch(function(){ totalEl.textContent = "发送失败，请检查网络。"; });
}

/* 直线／矩形／圆形工具：拖出形状后会自动变成「选取」状态，方便立刻再调整位置；
   跟笔画一样，形状会一直留在画板上（可以随时用「选取/移动」工具拖动、用橡皮擦擦掉），
   不会像图片那样在换工具后被压平定型。 */
var boardShapeTool = null; // null | "line" | "rect" | "ellipse"
var boardCurrentShape = null;
var boardShapeSeq = 0;
var selectedStrokeId = null;

function initBoardButton(){
  $("boardBtn").hidden = false;
}

function getBoardPos(e){
  var rect = boardCanvas.getBoundingClientRect();
  var scaleX = boardCanvas.width / rect.width;
  var scaleY = boardCanvas.height / rect.height;
  var clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  var clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
  return { x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
}

function boardDrawSegment(x0,y0,x1,y1,color,size){
  boardCtx.save();
  boardCtx.lineCap = "round"; boardCtx.lineJoin = "round";
  boardCtx.globalCompositeOperation = "source-over";
  boardCtx.strokeStyle = color;
  boardCtx.lineWidth = size;
  boardCtx.beginPath();
  boardCtx.moveTo(x0,y0);
  boardCtx.lineTo(x1,y1);
  boardCtx.stroke();
  boardCtx.restore();
}

function redrawBoard(){
  if (!boardCtx) return;
  boardCtx.fillStyle = "#ffffff"; boardCtx.fillRect(0,0,boardCanvas.width,boardCanvas.height);
  if (boardBgImage){
    var bw = boardBgImage.width, bh = boardBgImage.height;
    if (bw && bh){
      var ratio = Math.min(boardCanvas.width/bw, boardCanvas.height/bh);
      var w = bw*ratio, h = bh*ratio;
      var offX = (boardCanvas.width-w)/2, offY = (boardCanvas.height-h)/2;
      boardCtx.drawImage(boardBgImage, offX, offY, w, h);
    }
  }
  boardImages.forEach(function(o){
    if (boardCropMode && o.id === selectedImageId){
      // 裁剪模式：先显示整张原图，方便挑选要保留的区域
      boardCtx.drawImage(o.img, 0,0,o.img.width,o.img.height, o.x,o.y,o.w,o.h);
    } else {
      boardCtx.drawImage(o.img, o.cropX,o.cropY,o.cropW,o.cropH, o.x,o.y,o.w,o.h);
    }
  });
  boardStrokes.forEach(function(s){
    boardCtx.save();
    boardCtx.lineCap = "round"; boardCtx.lineJoin = "round";
    boardCtx.globalCompositeOperation = "source-over";
    boardCtx.strokeStyle = s.color; boardCtx.lineWidth = s.size;
    if (s.type === "line"){
      boardCtx.beginPath();
      boardCtx.moveTo(s.x1, s.y1); boardCtx.lineTo(s.x2, s.y2);
      boardCtx.stroke();
    } else if (s.type === "rect"){
      var rx = Math.min(s.x1,s.x2), ry = Math.min(s.y1,s.y2), rw = Math.abs(s.x2-s.x1), rh = Math.abs(s.y2-s.y1);
      boardCtx.strokeRect(rx, ry, rw, rh);
    } else if (s.type === "ellipse"){
      var ecx = (s.x1+s.x2)/2, ecy = (s.y1+s.y2)/2, erx = Math.abs(s.x2-s.x1)/2, ery = Math.abs(s.y2-s.y1)/2;
      boardCtx.beginPath();
      boardCtx.ellipse(ecx, ecy, Math.max(erx,0.01), Math.max(ery,0.01), 0, 0, Math.PI*2);
      boardCtx.stroke();
    } else if (s.pts && s.pts.length === 1){
      boardCtx.beginPath();
      boardCtx.arc(s.pts[0].x, s.pts[0].y, s.size/2, 0, Math.PI*2);
      boardCtx.fillStyle = s.color; boardCtx.fill();
    } else if (s.pts && s.pts.length > 1){
      boardCtx.beginPath();
      boardCtx.moveTo(s.pts[0].x, s.pts[0].y);
      for (var i=1;i<s.pts.length;i++) boardCtx.lineTo(s.pts[i].x, s.pts[i].y);
      boardCtx.stroke();
    }
    boardCtx.restore();
  });

  if (boardCropMode && boardCropRect){
    var cropSel = getSelectedImage();
    if (cropSel){
      boardCtx.save();
      boardCtx.fillStyle = "rgba(20,20,25,.55)";
      boardCtx.fillRect(cropSel.x, cropSel.y, cropSel.w, cropSel.h);
      boardCtx.save();
      boardCtx.beginPath(); boardCtx.rect(boardCropRect.x, boardCropRect.y, boardCropRect.w, boardCropRect.h); boardCtx.clip();
      boardCtx.drawImage(cropSel.img, 0,0,cropSel.img.width,cropSel.img.height, cropSel.x,cropSel.y,cropSel.w,cropSel.h);
      boardCtx.restore();
      boardCtx.strokeStyle = "#FF6B4A"; boardCtx.lineWidth = 3;
      boardCtx.strokeRect(boardCropRect.x, boardCropRect.y, boardCropRect.w, boardCropRect.h);
      boardCtx.fillStyle = "#FF6B4A";
      boardCtx.beginPath(); boardCtx.arc(boardCropRect.x+boardCropRect.w, boardCropRect.y+boardCropRect.h, 12, 0, Math.PI*2); boardCtx.fill();
      boardCtx.restore();
    }
  } else {
    var sel = getSelectedImage();
    if (sel){
      boardCtx.save();
      boardCtx.strokeStyle = "#2EC4B6"; boardCtx.lineWidth = 3; boardCtx.setLineDash([10,6]);
      boardCtx.strokeRect(sel.x, sel.y, sel.w, sel.h);
      boardCtx.setLineDash([]);
      boardCtx.fillStyle = "#2EC4B6";
      boardCtx.beginPath(); boardCtx.arc(sel.x+sel.w, sel.y+sel.h, 12, 0, Math.PI*2); boardCtx.fill();
      boardCtx.restore();
    }
    var selS = getSelectedStroke();
    if (selS){
      var bb = strokeBBox(selS);
      boardCtx.save();
      boardCtx.strokeStyle = "#2EC4B6"; boardCtx.lineWidth = 3; boardCtx.setLineDash([10,6]);
      boardCtx.strokeRect(bb.x-10, bb.y-10, bb.w+20, bb.h+20);
      boardCtx.setLineDash([]);
      boardCtx.restore();
    }
  }
}

function imageAt(pos){
  for (var i=boardImages.length-1;i>=0;i--){
    var o = boardImages[i];
    if (pos.x>=o.x && pos.x<=o.x+o.w && pos.y>=o.y && pos.y<=o.y+o.h) return o;
  }
  return null;
}
function getSelectedImage(){
  for (var i=0;i<boardImages.length;i++){ if (boardImages[i].id===selectedImageId) return boardImages[i]; }
  return null;
}
function getSelectedStroke(){
  for (var i=0;i<boardStrokes.length;i++){ if (boardStrokes[i].id===selectedStrokeId) return boardStrokes[i]; }
  return null;
}
function strokeBBox(s){
  if (s.type === "line" || s.type === "rect" || s.type === "ellipse"){
    return { x:Math.min(s.x1,s.x2), y:Math.min(s.y1,s.y2), w:Math.abs(s.x2-s.x1), h:Math.abs(s.y2-s.y1) };
  }
  if (!s.pts || !s.pts.length) return { x:0, y:0, w:0, h:0 };
  var minX=s.pts[0].x, maxX=s.pts[0].x, minY=s.pts[0].y, maxY=s.pts[0].y;
  s.pts.forEach(function(p){
    minX = Math.min(minX,p.x); maxX = Math.max(maxX,p.x);
    minY = Math.min(minY,p.y); maxY = Math.max(maxY,p.y);
  });
  return { x:minX, y:minY, w:maxX-minX, h:maxY-minY };
}
function translateStroke(s, dx, dy){
  if (s.type === "line" || s.type === "rect" || s.type === "ellipse"){
    s.x1 += dx; s.y1 += dy; s.x2 += dx; s.y2 += dy;
  } else if (s.pts){
    for (var i=0;i<s.pts.length;i++){ s.pts[i].x += dx; s.pts[i].y += dy; }
  }
}
function strokeAt(pos){
  for (var i=boardStrokes.length-1;i>=0;i--){
    var s = boardStrokes[i];
    if (boardStrokeHit(s, pos.x, pos.y, Math.max(14, (s.size||8)/2+10))) return s;
  }
  return null;
}

/* 把当前压平的（背景+图片+笔画）状态定型，之后不能再单独调整插入过的图片。
   跟橡皮擦只能擦自己笔画一样，这是「压平即定型」的既有设计，用来避免正在编辑
   的图片跟画面其他内容互相打架。 */
function commitPendingImageEdit(){
  if (!boardImages.length) return;
  selectedImageId = null;
  boardCropMode = false; boardCropRect = null;
  redrawBoard(); // 先把选取框/裁剪蒙层去掉，避免被一起压进背景图里
  var snap = document.createElement("canvas");
  snap.width = boardCanvas.width; snap.height = boardCanvas.height;
  snap.getContext("2d").drawImage(boardCanvas, 0, 0);
  boardBgImage = snap;
  boardImages = [];
  boardStrokes = [];
  boardVersion += 1;
  boardStateLoaded = true;
  redrawBoard();
  saveBoardSnapshot();
}

function placeNewImage(imgEl){
  commitPendingImageEdit();
  var natW = imgEl.width, natH = imgEl.height;
  if (!natW || !natH) return;
  var maxW = boardCanvas.width*0.6, maxH = boardCanvas.height*0.6;
  var scale = Math.min(maxW/natW, maxH/natH, 1);
  var w = natW*scale, h = natH*scale;
  var x = (boardCanvas.width-w)/2, y = (boardCanvas.height-h)/2;
  var newId = "img-"+(++boardImgSeq)+"-"+Date.now();
  boardImages.push({ id:newId, img:imgEl, cropX:0,cropY:0,cropW:natW,cropH:natH, x:x,y:y,w:w,h:h });
  selectedImageId = newId;
  selectedStrokeId = null;
  boardShapeTool = null; boardCurrentShape = null;
  clearShapeBtnActive();
  boardSelecting = true; boardErasing = false;
  $("boardSelectBtn").classList.add("active");
  $("boardEraser").classList.remove("active");
  document.querySelectorAll(".board-color").forEach(function(b){ b.classList.remove("active"); });
  updateBoardToolUI();
  redrawBoard();
}

function updateBoardToolUI(){
  $("boardImgSelActions").hidden = !(selectedImageId && !boardCropMode);
  $("boardCropActions").hidden = !boardCropMode;
  $("boardStrokeSelActions").hidden = !selectedStrokeId;
}
function clearShapeBtnActive(){
  $("boardLineBtn").classList.remove("active");
  $("boardRectBtn").classList.remove("active");
  $("boardEllipseBtn").classList.remove("active");
}

function distToBoardSeg(px,py,x1,y1,x2,y2){
  var dx=x2-x1, dy=y2-y1;
  var lenSq = dx*dx+dy*dy;
  var t = lenSq ? ((px-x1)*dx+(py-y1)*dy)/lenSq : 0;
  t = Math.max(0, Math.min(1, t));
  var cx = x1+t*dx, cy = y1+t*dy;
  return Math.hypot(px-cx, py-cy);
}
function boardStrokeHit(stroke, px, py, radius){
  if (stroke.type === "line"){
    return distToBoardSeg(px,py,stroke.x1,stroke.y1,stroke.x2,stroke.y2) <= radius;
  }
  if (stroke.type === "rect" || stroke.type === "ellipse"){
    var minX = Math.min(stroke.x1,stroke.x2)-radius, maxX = Math.max(stroke.x1,stroke.x2)+radius;
    var minY = Math.min(stroke.y1,stroke.y2)-radius, maxY = Math.max(stroke.y1,stroke.y2)+radius;
    return px>=minX && px<=maxX && py>=minY && py<=maxY;
  }
  if (!stroke.pts || !stroke.pts.length) return false;
  if (stroke.pts.length === 1){
    return Math.hypot(px-stroke.pts[0].x, py-stroke.pts[0].y) <= radius;
  }
  for (var i=1;i<stroke.pts.length;i++){
    if (distToBoardSeg(px,py,stroke.pts[i-1].x,stroke.pts[i-1].y,stroke.pts[i].x,stroke.pts[i].y) <= radius) return true;
  }
  return false;
}

/* 老师的橡皮擦不受限制，能擦掉任何人（包括学生）画的东西 */
function eraseBoardAt(pos){
  var changed = false;
  for (var i = boardStrokes.length-1; i>=0; i--){
    var s = boardStrokes[i];
    if (boardStrokeHit(s, pos.x, pos.y, BOARD_ERASE_RADIUS + s.size/2)){
      boardStrokes.splice(i,1);
      broadcastBoardErase(s.id);
      changed = true;
    }
  }
  if (changed) redrawBoard();
}

function broadcastBoardStroke(strokeId, owner, color, size, x0,y0,x1,y1){
  if (!boardChannel) return;
  boardChannel.send({ type:"broadcast", event:"stroke", payload:{strokeId:strokeId, owner:owner, color:color, size:size, x0:x0,y0:y0,x1:x1,y1:y1} });
}
function broadcastBoardErase(strokeId){
  if (!boardChannel) return;
  boardChannel.send({ type:"broadcast", event:"eraseStroke", payload:{strokeId:strokeId} });
}
/* 形状（直线/矩形/圆形）和被拖动过的笔画不是一段一段广播的，
   而是每次变动就把完整的最新形状/位置发出去，让学生那边直接对齐。 */
function broadcastStrokeUpdate(s){
  if (!boardChannel) return;
  boardChannel.send({ type:"broadcast", event:"strokeUpdate", payload:{
    id:s.id, type:s.type||"pen", owner:s.owner, color:s.color, size:s.size,
    x1:s.x1, y1:s.y1, x2:s.x2, y2:s.y2, pts:s.pts
  }});
}

function boardPointerDown(e){
  e.preventDefault();
  boardIsDrawing = true;
  var pos = getBoardPos(e);
  boardLastPos = pos;

  if (boardShapeTool){
    var newShape = { id: TEACHER_OWNER+"-shp-"+(++boardShapeSeq)+"-"+Date.now(), type: boardShapeTool, owner: TEACHER_OWNER, color: boardColor, size: 8, x1:pos.x, y1:pos.y, x2:pos.x, y2:pos.y };
    boardStrokes.push(newShape);
    boardCurrentShape = newShape;
    return;
  }

  if (boardSelecting){
    if (boardCropMode && boardCropRect){
      var onCropHandle = Math.hypot(pos.x-(boardCropRect.x+boardCropRect.w), pos.y-(boardCropRect.y+boardCropRect.h)) <= IMG_HANDLE;
      if (onCropHandle) boardDragMode = "crop-resize";
      else if (pos.x>=boardCropRect.x && pos.x<=boardCropRect.x+boardCropRect.w && pos.y>=boardCropRect.y && pos.y<=boardCropRect.y+boardCropRect.h) boardDragMode = "crop-move";
      else boardDragMode = null;
      return;
    }
    var sel = getSelectedImage();
    if (sel && Math.hypot(pos.x-(sel.x+sel.w), pos.y-(sel.y+sel.h)) <= IMG_HANDLE){
      boardDragMode = "resize";
      boardDragOrig = { aspect: sel.w/sel.h };
      return;
    }
    var hit = imageAt(pos);
    if (hit){
      if (selectedStrokeId) selectedStrokeId = null;
      selectedImageId = hit.id;
      boardDragMode = "move";
      updateBoardToolUI();
      redrawBoard();
      return;
    }
    var strokeHitObj = strokeAt(pos);
    if (strokeHitObj){
      if (selectedImageId) commitPendingImageEdit();
      selectedImageId = null;
      selectedStrokeId = strokeHitObj.id;
      boardDragMode = "moveStroke";
      updateBoardToolUI();
      redrawBoard();
      return;
    }
    if (selectedImageId) commitPendingImageEdit();
    selectedImageId = null;
    selectedStrokeId = null;
    boardDragMode = null;
    updateBoardToolUI();
    redrawBoard();
    return;
  }

  if (boardErasing){
    eraseBoardAt(pos);
  } else {
    boardCurrentStroke = { id: TEACHER_OWNER+"-"+Date.now()+"-"+Math.random().toString(36).slice(2), owner: TEACHER_OWNER, color: boardColor, size: 8, pts:[pos] };
    boardStrokes.push(boardCurrentStroke);
  }
}
function boardPointerMove(e){
  if (!boardIsDrawing) return;
  e.preventDefault();
  var pos = getBoardPos(e);

  if (boardCurrentShape){
    boardCurrentShape.x2 = pos.x; boardCurrentShape.y2 = pos.y;
    redrawBoard();
    broadcastStrokeUpdate(boardCurrentShape);
    boardLastPos = pos;
    return;
  }

  if (boardSelecting){
    var dx = pos.x - boardLastPos.x, dy = pos.y - boardLastPos.y;
    if (boardDragMode === "move"){
      var selM = getSelectedImage();
      if (selM){ selM.x += dx; selM.y += dy; redrawBoard(); }
    } else if (boardDragMode === "moveStroke"){
      var selStrokeM = getSelectedStroke();
      if (selStrokeM){ translateStroke(selStrokeM, dx, dy); redrawBoard(); broadcastStrokeUpdate(selStrokeM); }
    } else if (boardDragMode === "resize" && boardDragOrig){
      var selR = getSelectedImage();
      if (selR){
        selR.w = Math.max(30, selR.w + dx);
        selR.h = selR.w / boardDragOrig.aspect;
        redrawBoard();
      }
    } else if (boardDragMode === "crop-move" && boardCropRect){
      var selCM = getSelectedImage();
      boardCropRect.x += dx; boardCropRect.y += dy;
      if (selCM){
        boardCropRect.x = Math.max(selCM.x, Math.min(boardCropRect.x, selCM.x+selCM.w-boardCropRect.w));
        boardCropRect.y = Math.max(selCM.y, Math.min(boardCropRect.y, selCM.y+selCM.h-boardCropRect.h));
      }
      redrawBoard();
    } else if (boardDragMode === "crop-resize" && boardCropRect){
      var selCR = getSelectedImage();
      var newW = Math.max(20, boardCropRect.w + dx);
      var newH = Math.max(20, boardCropRect.h + dy);
      if (selCR){
        newW = Math.min(newW, selCR.x+selCR.w-boardCropRect.x);
        newH = Math.min(newH, selCR.y+selCR.h-boardCropRect.y);
      }
      boardCropRect.w = newW; boardCropRect.h = newH;
      redrawBoard();
    }
    boardLastPos = pos;
    return;
  }

  if (boardErasing){
    eraseBoardAt(pos);
  } else if (boardCurrentStroke){
    boardCurrentStroke.pts.push(pos);
    boardDrawSegment(boardLastPos.x, boardLastPos.y, pos.x, pos.y, boardCurrentStroke.color, boardCurrentStroke.size);
    broadcastBoardStroke(boardCurrentStroke.id, boardCurrentStroke.owner, boardCurrentStroke.color, boardCurrentStroke.size, boardLastPos.x, boardLastPos.y, pos.x, pos.y);
  }
  boardLastPos = pos;
}
function boardPointerUp(){
  if (!boardIsDrawing) return;
  boardIsDrawing = false;
  boardLastPos = null;
  if (boardCurrentShape){
    var newS = boardCurrentShape;
    boardCurrentShape = null;
    if (Math.hypot(newS.x2-newS.x1, newS.y2-newS.y1) < 6){
      // 几乎没拖动，当成误触，不留下这个形状
      var idx = boardStrokes.indexOf(newS);
      if (idx>=0) boardStrokes.splice(idx,1);
      redrawBoard();
    } else {
      broadcastStrokeUpdate(newS);
      scheduleBoardSnapshot();
      // 画完形状自动切到「选取」状态并选中它，方便老师立刻拖动调整位置
      boardShapeTool = null;
      clearShapeBtnActive();
      boardSelecting = true;
      selectedStrokeId = newS.id;
      $("boardSelectBtn").classList.add("active");
      updateBoardToolUI();
      redrawBoard();
    }
    return;
  }
  if (boardSelecting){
    if (boardDragMode === "moveStroke") scheduleBoardSnapshot();
    boardDragMode = null;
    boardDragOrig = null;
    return;
  }
  boardCurrentStroke = null;
  scheduleBoardSnapshot();
}

function scheduleBoardSnapshot(){
  if (boardSnapshotTimer) clearTimeout(boardSnapshotTimer);
  boardSnapshotTimer = setTimeout(saveBoardSnapshot, 1200);
}

function saveBoardSnapshot(){
  if (!pollClient || !boardCanvas) return;
  var dataUrl = boardCanvas.toDataURL("image/png");
  pollClient.from("live_board").upsert({ id:"current", version:boardVersion, snapshot:dataUrl, updated_at:new Date().toISOString() }).then(function(res){
    if (res.error) { /* 保存失败不影响老师这边继续画，学生端下次连线时会补上最新状态 */ }
  });
}

function loadBoardImage(dataUrl, cb){
  if (!dataUrl){ boardBgImage = null; redrawBoard(); if (cb) cb(); return; }
  var img = new Image();
  img.onload = function(){ boardBgImage = img; redrawBoard(); if (cb) cb(); };
  img.onerror = function(){ if (cb) cb(); };
  img.src = dataUrl;
}

/* 老师端每次点开白板都会重新对齐服务器状态；只有版本真的变了（老师/学生把统计图设成
   背景，或按了清空画板）才会重置成新的「压平底图」，避免每次开关面板都把大家画的笔画
   重复叠一层、或让「只能擦自己的」失效。 */
function applyBoardRow(row){
  boardAllowedIds = Array.isArray(row.allowed_client_ids) ? row.allowed_client_ids : [];
  renderBoardRoster();
  var v = row.version || 0;
  if (!boardStateLoaded || v !== boardVersion){
    boardVersion = v;
    boardStrokes = [];
    boardImages = [];
    selectedImageId = null;
    selectedStrokeId = null;
    boardCropMode = false; boardCropRect = null;
    boardStateLoaded = true;
    updateBoardToolUI();
    loadBoardImage(row.snapshot);
  }
}

function ensureBoardCanvas(){
  if (boardCanvas) return;
  boardCanvas = $("boardCanvas");
  boardCtx = boardCanvas.getContext("2d");
  redrawBoard();
  boardCanvas.addEventListener("pointerdown", boardPointerDown);
  boardCanvas.addEventListener("pointermove", boardPointerMove);
  window.addEventListener("pointerup", boardPointerUp);
}

function renderBoardRoster(){
  var list = $("boardRosterList");
  var ids = Object.keys(boardRoster);
  $("boardRosterCount").textContent = String(ids.length);
  clearEl(list);
  if (!ids.length){
    list.appendChild(el("div","board-roster-empty","还没有学生打开白板网址……"));
    return;
  }
  ids.sort(function(a,b){ return boardRoster[a].localeCompare(boardRoster[b], "zh"); }).forEach(function(cid){
    var isAllowed = boardAllowedIds.indexOf(cid) >= 0;
    var item = el("div","board-roster-item" + (isAllowed ? " allowed" : ""));
    var cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = isAllowed;
    cb.addEventListener("click", function(e){ e.stopPropagation(); toggleStudentAllowed(cid); });
    item.appendChild(cb);
    item.appendChild(el("div","name", boardRoster[cid]));
    item.appendChild(el("div","tag", isAllowed ? "可以画" : "只能看"));
    item.addEventListener("click", function(){ toggleStudentAllowed(cid); });
    list.appendChild(item);
  });
}

function persistAllowedIds(){
  if (!pollClient) return;
  pollClient.from("live_board").upsert({ id:"current", version:boardVersion, allowed_client_ids:boardAllowedIds, updated_at:new Date().toISOString() }).then(function(res){
    if (res.error){
      alert("❌ 授权没有保存成功：" + res.error.message + "\n\n很可能是 Supabase 的 live_board 表还没加 allowed_client_ids 字段，请到 Supabase 的 SQL Editor 跑一次：\nalter table live_board add column if not exists allowed_client_ids jsonb not null default '[]'::jsonb;");
    }
  });
}

function toggleStudentAllowed(cid){
  var idx = boardAllowedIds.indexOf(cid);
  if (idx>=0) boardAllowedIds.splice(idx,1); else boardAllowedIds.push(cid);
  renderBoardRoster();
  persistAllowedIds();
}

function subscribeBoardPresence(){
  if (!pollClient) return;
  if (boardPresenceChannel) pollClient.removeChannel(boardPresenceChannel);
  boardPresenceChannel = pollClient.channel("board-presence")
    .on("presence", { event:"sync" }, function(){
      var state = boardPresenceChannel.presenceState();
      var next = {};
      Object.keys(state).forEach(function(cid){
        var entries = state[cid];
        if (entries && entries.length) next[cid] = entries[0].name || "同学";
      });
      boardRoster = next;
      renderBoardRoster();
    })
    .subscribe();
}

function subscribeBoardRealtime(){
  if (!pollClient) return;
  if (boardChannel) pollClient.removeChannel(boardChannel);
  boardChannel = pollClient.channel("board-live")
    .on("broadcast", { event:"stroke" }, function(msg){
      var p = msg.payload;
      if (!p) return;
      var stroke = null;
      for (var i=0;i<boardStrokes.length;i++){ if (boardStrokes[i].id===p.strokeId){ stroke=boardStrokes[i]; break; } }
      if (!stroke){ stroke = { id:p.strokeId, owner:p.owner, color:p.color, size:p.size, pts:[{x:p.x0,y:p.y0}] }; boardStrokes.push(stroke); }
      stroke.pts.push({x:p.x1,y:p.y1});
      boardDrawSegment(p.x0,p.y0,p.x1,p.y1,p.color,p.size);
    })
    .on("broadcast", { event:"eraseStroke" }, function(msg){
      var p = msg.payload;
      if (!p) return;
      for (var i=0;i<boardStrokes.length;i++){ if (boardStrokes[i].id===p.strokeId){ boardStrokes.splice(i,1); break; } }
      redrawBoard();
    })
    .on("broadcast", { event:"strokeUpdate" }, function(msg){
      var p = msg.payload;
      if (!p) return;
      var obj = { id:p.id, type:p.type, owner:p.owner, color:p.color, size:p.size, x1:p.x1, y1:p.y1, x2:p.x2, y2:p.y2, pts:p.pts };
      var idx = -1;
      for (var i=0;i<boardStrokes.length;i++){ if (boardStrokes[i].id===p.id){ idx=i; break; } }
      if (idx>=0) boardStrokes[idx] = obj; else boardStrokes.push(obj);
      redrawBoard();
    })
    .subscribe();
  subscribeBoardPresence();
  if (!boardTableWatched){
    boardTableWatched = true;
    pollClient.channel("board-row-watch")
      .on("postgres_changes", { event:"UPDATE", schema:"public", table:"live_board", filter:"id=eq.current" }, function(payload){
        var row = payload.new;
        if (!row) return;
        applyBoardRow(row);
      })
      .subscribe();
  }
}

function openBoard(){
  $("boardOverlay").classList.add("show");
  ensureBoardCanvas();
  if (!pollClient) return;
  pollClient.from("live_board").select("*").eq("id","current").maybeSingle().then(function(res){
    applyBoardRow(res.data || { version:0, allowed_client_ids:[], snapshot:null });
    subscribeBoardRealtime();
  });
}

function setBoardBackgroundFromStage(){
  if (typeof html2canvas === "undefined"){ alert("背景截图工具还没加载好，请稍等几秒再试一次。"); return; }
  var stageEl = document.getElementById("stage");
  html2canvas(stageEl, {
    backgroundColor:"#ffffff",
    scale:2,
    ignoreElements: function(node){
      // 白板本身的半透明弹窗背景跟统计图在屏幕上同一个位置，
      // 截图时要跳过它（还有举手统计弹窗），不然截出来的背景会变成灰蒙蒙一片。
      return node.id === "boardOverlay" || node.id === "pollOverlay";
    }
  }).then(function(shot){
    placeNewImage(shot);
  }).catch(function(){ alert("截图失败，请再试一次。"); });
}

function handleBoardImageFile(file){
  if (!file || !/^image\//.test(file.type)) return;
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){ placeNewImage(img); };
    img.onerror = function(){ alert("这张图片打不开，请换一张试试。"); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function clearBoardCanvas(){
  if (!boardCanvas) return;
  boardStrokes = [];
  boardImages = [];
  selectedImageId = null;
  selectedStrokeId = null;
  boardShapeTool = null; boardCurrentShape = null;
  clearShapeBtnActive();
  boardCropMode = false; boardCropRect = null;
  boardBgImage = null;
  boardVersion += 1;
  boardStateLoaded = true;
  updateBoardToolUI();
  redrawBoard();
  saveBoardSnapshot();
}

function exitSelectTool(){
  if (!boardSelecting) return;
  boardSelecting = false;
  $("boardSelectBtn").classList.remove("active");
  if (selectedImageId) commitPendingImageEdit();
  selectedStrokeId = null;
  updateBoardToolUI();
  redrawBoard();
}

$("boardBtn").addEventListener("click", openBoard);
$("boardCloseBtn").addEventListener("click", function(){
  if (selectedImageId) commitPendingImageEdit();
  selectedStrokeId = null;
  $("boardOverlay").classList.remove("show");
});
$("boardClearBtn").addEventListener("click", clearBoardCanvas);
$("boardBgBtn").addEventListener("click", setBoardBackgroundFromStage);
$("boardInsertImgBtn").addEventListener("click", function(){ $("boardImgFileInput").click(); });
$("boardImgFileInput").addEventListener("change", function(e){
  if (e.target.files && e.target.files[0]) handleBoardImageFile(e.target.files[0]);
  e.target.value = "";
});
document.addEventListener("paste", function(e){
  if (!$("boardOverlay").classList.contains("show")) return;
  var items = (e.clipboardData && e.clipboardData.items) || [];
  for (var i=0;i<items.length;i++){
    if (items[i].type && items[i].type.indexOf("image/")===0){
      var file = items[i].getAsFile();
      if (file){ handleBoardImageFile(file); e.preventDefault(); }
      break;
    }
  }
});
$("boardSelectBtn").addEventListener("click", function(){
  boardShapeTool = null; boardCurrentShape = null;
  clearShapeBtnActive();
  boardSelecting = true;
  boardErasing = false;
  this.classList.add("active");
  $("boardEraser").classList.remove("active");
  document.querySelectorAll(".board-color").forEach(function(b){ b.classList.remove("active"); });
  updateBoardToolUI();
});
function setShapeTool(tool){
  exitSelectTool();
  boardErasing = false; $("boardEraser").classList.remove("active");
  document.querySelectorAll(".board-color").forEach(function(b){ b.classList.remove("active"); });
  boardShapeTool = tool;
  clearShapeBtnActive();
  var map = { line:"boardLineBtn", rect:"boardRectBtn", ellipse:"boardEllipseBtn" };
  if (map[tool]) $(map[tool]).classList.add("active");
}
$("boardLineBtn").addEventListener("click", function(){ setShapeTool("line"); });
$("boardRectBtn").addEventListener("click", function(){ setShapeTool("rect"); });
$("boardEllipseBtn").addEventListener("click", function(){ setShapeTool("ellipse"); });
$("boardDeleteStrokeBtn").addEventListener("click", function(){
  var idx = -1;
  for (var i=0;i<boardStrokes.length;i++){ if (boardStrokes[i].id===selectedStrokeId){ idx=i; break; } }
  if (idx>=0){
    broadcastBoardErase(boardStrokes[idx].id);
    boardStrokes.splice(idx,1);
  }
  selectedStrokeId = null;
  updateBoardToolUI();
  redrawBoard();
  scheduleBoardSnapshot();
});
$("boardCropBtn").addEventListener("click", function(){
  var sel = getSelectedImage();
  if (!sel) return;
  boardCropMode = true;
  var natW = sel.img.width, natH = sel.img.height;
  var dispScaleX = sel.w/natW, dispScaleY = sel.h/natH;
  boardCropRect = {
    x: sel.x + sel.cropX*dispScaleX,
    y: sel.y + sel.cropY*dispScaleY,
    w: sel.cropW*dispScaleX,
    h: sel.cropH*dispScaleY
  };
  updateBoardToolUI();
  redrawBoard();
});
$("boardCropCancelBtn").addEventListener("click", function(){
  boardCropMode = false; boardCropRect = null;
  updateBoardToolUI(); redrawBoard();
});
$("boardCropConfirmBtn").addEventListener("click", function(){
  var sel = getSelectedImage();
  if (sel && boardCropRect){
    var natW = sel.img.width, natH = sel.img.height;
    var dispScaleX = sel.w/natW, dispScaleY = sel.h/natH;
    var nx = (boardCropRect.x - sel.x)/dispScaleX;
    var ny = (boardCropRect.y - sel.y)/dispScaleY;
    var nw = boardCropRect.w/dispScaleX;
    var nh = boardCropRect.h/dispScaleY;
    nx = Math.max(0, Math.min(nx, natW-4));
    ny = Math.max(0, Math.min(ny, natH-4));
    nw = Math.max(4, Math.min(nw, natW-nx));
    nh = Math.max(4, Math.min(nh, natH-ny));
    sel.cropX = nx; sel.cropY = ny; sel.cropW = nw; sel.cropH = nh;
    sel.h = sel.w * (nh/nw);
  }
  boardCropMode = false; boardCropRect = null;
  updateBoardToolUI(); redrawBoard();
});
$("boardDeleteImgBtn").addEventListener("click", function(){
  for (var i=0;i<boardImages.length;i++){
    if (boardImages[i].id === selectedImageId){ boardImages.splice(i,1); break; }
  }
  selectedImageId = null;
  boardCropMode = false; boardCropRect = null;
  updateBoardToolUI();
  redrawBoard();
});
$("boardEraser").addEventListener("click", function(){
  exitSelectTool();
  boardShapeTool = null; boardCurrentShape = null;
  clearShapeBtnActive();
  boardErasing = !boardErasing;
  this.classList.toggle("active", boardErasing);
  document.querySelectorAll(".board-color").forEach(function(b){ b.classList.remove("active"); });
});
document.querySelectorAll(".board-color").forEach(function(b){
  b.addEventListener("click", function(){
    exitSelectTool();
    boardShapeTool = null; boardCurrentShape = null;
    clearShapeBtnActive();
    boardErasing = false;
    $("boardEraser").classList.remove("active");
    document.querySelectorAll(".board-color").forEach(function(x){ x.classList.remove("active"); });
    b.classList.add("active");
    boardColor = b.dataset.color;
  });
});
$("boardAllowAllBtn").addEventListener("click", function(){
  boardAllowedIds = Object.keys(boardRoster);
  renderBoardRoster();
  persistAllowedIds();
});
$("boardRevokeAllBtn").addEventListener("click", function(){
  boardAllowedIds = [];
  renderBoardRoster();
  persistAllowedIds();
});

initPoll();

buildSidebar();
render();

})();
</script>

</body></html>
