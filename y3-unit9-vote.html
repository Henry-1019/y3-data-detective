<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>举手统计 · 学生作答</title>
<!--
  =====================================================================
  这是「举手统计」的学生作答页，跟 index.html（数据小侦探练习游戏）用
  同一个 Supabase 专案，不需要额外建专案，只需要多建两张表：

  create table if not exists live_poll (
    id text primary key default 'current',
    version int not null default 0,
    question text not null default '',
    options jsonb not null default '[]'::jsonb,
    correct_option text,
    mode text not null default 'choice',
    payload jsonb,
    updated_at timestamptz not null default now()
  );
  insert into live_poll (id, version, question, options)
    values ('current', 0, '', '[]'::jsonb)
    on conflict (id) do nothing;

  -- 如果之前已经建过 live_poll / live_votes 表（还没有姓名/正确答案功能，
  -- 或者还没有数字键盘题、拖拽题的举手统计功能），只需要多跑这几行，把新
  -- 栏位加上去就好，不用重建整张表：
  -- alter table live_poll add column if not exists correct_option text;
  -- alter table live_poll add column if not exists mode text not null default 'choice';
  -- alter table live_poll add column if not exists payload jsonb;
  -- alter table live_votes add column if not exists name text not null default '';
  -- alter table live_votes add column if not exists client_id text not null default '';

  create table if not exists live_votes (
    id bigint generated by default as identity primary key,
    version int not null,
    choice text not null,
    name text not null default '',
    client_id text not null default '',
    submitted_at timestamptz not null default now()
  );

  alter table live_poll enable row level security;
  alter table live_votes enable row level security;

  drop policy if exists "anyone can read poll" on live_poll;
  create policy "anyone can read poll" on live_poll for select to anon using (true);
  drop policy if exists "anyone can write poll" on live_poll;
  create policy "anyone can write poll" on live_poll for insert to anon with check (true);
  drop policy if exists "anyone can update poll" on live_poll;
  create policy "anyone can update poll" on live_poll for update to anon using (true) with check (true);

  drop policy if exists "anyone can read votes" on live_votes;
  create policy "anyone can read votes" on live_votes for select to anon using (true);
  drop policy if exists "anyone can submit votes" on live_votes;
  create policy "anyone can submit votes" on live_votes for insert to anon with check (true);

  grant usage on schema public to anon, authenticated;
  grant select, insert, update on live_poll to anon;
  grant select, insert on live_votes to anon;

  跑完以上 SQL 后，记得到 Database → Publications，把 live_poll 和
  live_votes 两张表也加进 supabase_realtime，不然老师端和学生端都不会
  即时更新（需要手动按刷新才看得到）。

  学生进入这个页面时会先输入名字（会记住，同一台设备也可以点「换名字」给
  下一位同学用），提交答案时名字会一起送过去，老师那边才知道是谁答对/答错。
  如果老师那一题有标准答案，老师端还会自动算出「最快答对的前三名」排行榜。

  这一页现在支持三种题型，学生看到的画面和作答方式都跟老师端一模一样：
  选择题/多选题（按按钮选答案）、数字键盘题（按数字键盘打字作答）、
  拖拽题（点卡片、再点格子放上去，跟老师端一样）。老师端会用 mode 栏位
  告诉这个页面要显示哪一种，payload 栏位（拖拽题用）带着这一题的卡片和
  格子内容，让学生这边能生成一模一样的题目。

  部署方式：把这个文件跟 index.html 放在同一个 GitHub 仓库根目录下，
  一起推上 Vercel，网址就会是 你的网址.vercel.app/y3-unit9-vote.html，
  这个网址就是要发给学生在课堂上打开的。
  =====================================================================
-->
<style>
  :root{
    --bg:#FFF6E9; --bg-soft:#FFEFD6; --panel:#FFFFFF; --ink:#2B2A33; --ink-soft:#6B6879; --line:#EFE2CC;
    --primary:#FF6B4A; --primary-ink:#7A2A18; --secondary:#2EC4B6; --secondary-ink:#0B4A45; --wrong:#E63950;
    --wrong-bg:#FFE3E7; --correct-bg:#DFF7EE; --shadow:0 10px 24px -12px rgba(43,42,51,.28);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{ background:var(--panel); border-radius:24px; box-shadow:var(--shadow); padding:28px 24px; max-width:480px; width:100%; text-align:center; }
  .badge{ font-size:34px; margin-bottom:8px; }
  h1{ font-size:18px; margin:0 0 4px; }
  .sub{ font-size:13px; color:var(--ink-soft); margin:0 0 20px; }
  .qtext{ font-size:17px; font-weight:700; margin-bottom:18px; line-height:1.5; }
  .opts{ display:flex; flex-direction:column; gap:12px; }
  .opt-btn{ font:inherit; font-size:17px; font-weight:700; padding:16px; border-radius:16px; border:2px solid var(--line); background:#FFF9F0; cursor:pointer; }
  .opt-btn:active{ transform:scale(.98); }
  .opt-btn.picked{ background:var(--correct-bg); border-color:var(--secondary); }
  .opt-btn[disabled]{ opacity:.55; cursor:default; }
  .status{ margin-top:16px; font-size:14px; font-weight:700; color:var(--secondary-ink); min-height:20px; }
  .status.no{ color:#B4242E; }
  .waiting{ font-size:15px; color:var(--ink-soft); padding:30px 0; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--primary); margin:0 2px; animation:pulse 1.2s infinite ease-in-out; }
  .dot:nth-child(2){ animation-delay:.2s; } .dot:nth-child(3){ animation-delay:.4s; }
  @keyframes pulse{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }
  [hidden]{ display:none !important; }
  .name-input{ width:100%; font:inherit; font-size:16px; padding:12px 14px; border-radius:14px; border:2px solid var(--line); text-align:center; margin-bottom:12px; box-sizing:border-box; }
  .name-input:focus{ outline:none; border-color:var(--primary); }
  .name-go{ width:100%; font:inherit; font-weight:800; font-size:15px; background:var(--primary); color:#fff; border:none; border-radius:14px; padding:12px; cursor:pointer; }
  .name-err{ font-size:12px; color:#B4242E; min-height:16px; margin-top:6px; }
  .me-row{ font-size:12.5px; color:var(--ink-soft); margin:-10px 0 16px; }
  .me-row button{ font:inherit; border:none; background:none; color:var(--primary); text-decoration:underline; cursor:pointer; padding:0; margin-left:4px; }

  /* 数字键盘作答：跟老师端 makeNumberPad 长得、用起来都一样 */
  .numpad-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .numpad-display{ font-family:"Fredoka","Noto Sans SC",sans-serif; font-size:32px; font-weight:800; min-width:120px; text-align:center; padding:10px 22px; border-radius:16px; border:2px solid var(--line); background:var(--bg-soft); }
  .numpad-display.ok{ background:var(--correct-bg); border-color:var(--secondary); }
  .numpad-display.no{ background:var(--wrong-bg); border-color:var(--wrong); }
  .numpad-grid{ display:grid; grid-template-columns:repeat(3,64px); gap:10px; justify-content:center; }
  .numpad-key{ padding:14px 0; border-radius:14px; border:2px solid var(--line); background:var(--panel); font:inherit; font-weight:800; font-size:20px; cursor:pointer; }
  .numpad-key.go{ background:var(--primary); color:#fff; border-color:transparent; }
  .numpad-key[disabled]{ opacity:.6; cursor:default; }

  /* 拖拽作答：跟老师端 makeDragBlank 长得、用起来都一样（点卡片再点格子） */
  .dragblank-wrap{ display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; }
  .dragblank-slots{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .dragblank-col{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .dragblank-caption{ font-size:12px; color:var(--ink-soft); font-weight:700; max-width:100px; text-align:center; }
  .drag-slot{ min-width:58px; min-height:42px; border:2px dashed var(--line); border-radius:14px; background:var(--bg-soft); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; cursor:pointer; padding:6px 10px; }
  .drag-slot.filled{ border-style:solid; background:var(--panel); }
  .dragblank-pool{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; padding-top:10px; border-top:1px dashed var(--line); }
  .drag-chip{ padding:10px 16px; border-radius:12px; border:2px solid var(--line); background:var(--panel); font-weight:800; font-size:15px; cursor:pointer; user-select:none; }
  .drag-chip.selected{ border-color:var(--primary); background:var(--wrong-bg); }
  .drag-chip.used{ opacity:.3; cursor:default; }
  .drag-hint{ font-size:12px; color:var(--ink-soft); margin:-6px 0 0; }
  .drag-submit{ font:inherit; font-weight:800; font-size:15px; background:var(--primary); color:#fff; border:none; border-radius:14px; padding:12px 22px; cursor:pointer; margin-top:4px; }
  .drag-submit[disabled]{ opacity:.5; cursor:default; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">🖐️</div>
    <h1>举手统计</h1>
    <p class="sub" id="introText">请先输入你的名字，老师才知道是你答对还是答错。</p>
    <div id="nameGate">
      <input class="name-input" id="nameInput" type="text" maxlength="12" placeholder="例如：小明">
      <button class="name-go" id="nameGoBtn" type="button">进入</button>
      <div class="name-err" id="nameErr"></div>
    </div>
    <div class="me-row" id="meRow" hidden>你是「<span id="meLabel"></span>」<button id="changeNameBtn" type="button">换名字</button></div>
    <div id="app" hidden>
      <div class="waiting">正在连线，等待老师发布题目<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function(){
    "use strict";
    var SUPABASE_URL = "https://lfxabwakcthzcntqvbiy.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmeGFid2FrY3RoemNudHF2Yml5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTk1NTYsImV4cCI6MjEwNDQ3NTU1Nn0.O_5ut2mniPLTgeQ4Cy81_LhOVkgnwfALa7YVAA9PB30";
    var NAME_KEY = "y3vote_name";
    var CLIENT_KEY = "y3vote_client_id";
    var app = document.getElementById("app");
    var introText = document.getElementById("introText");
    var nameGate = document.getElementById("nameGate");
    var nameInput = document.getElementById("nameInput");
    var nameGoBtn = document.getElementById("nameGoBtn");
    var nameErr = document.getElementById("nameErr");
    var meRow = document.getElementById("meRow");
    var meLabel = document.getElementById("meLabel");
    var changeNameBtn = document.getElementById("changeNameBtn");
    var client = null;
    var pollWatchChannel = null;
    var currentVersion = 0;
    var myName = "";
    var myClientId = "";

    function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
    function clearEl(node){ while (node.firstChild) node.removeChild(node.firstChild); }
    function makeClientId(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }

    function votedKey(v){ return "y3vote_v" + v; }

    function renderWaiting(msg){
      clearEl(app);
      app.appendChild(el("div", "waiting", msg || "正在连线，等待老师发布题目…"));
    }

    /* 三种题型最后都是把一个「答案字符串」交给这个函数去提交，
       字符串的拼法要跟老师端 scrapeCurrentQuestion() 算 correct_option
       用的拼法完全一致，老师那边才能正确判断对错、算排行榜。 */
    function submitAnswer(poll, choiceStr, hooks){
      client.from("live_votes").insert({ version: poll.version, choice: choiceStr, name: myName, client_id: myClientId }).then(function(res){
        if (res.error){
          hooks.statusEl.textContent = "提交失败：" + res.error.message;
          hooks.statusEl.className = "status no";
          hooks.unlock();
          return;
        }
        try { localStorage.setItem(votedKey(poll.version), "1"); } catch (e) {}
        hooks.statusEl.textContent = "🎉 提交成功！等老师公布结果吧～";
        hooks.statusEl.className = "status";
      }).catch(function(){
        hooks.statusEl.textContent = "网络有问题，请再点一次。";
        hooks.statusEl.className = "status no";
        hooks.unlock();
      });
    }

    function renderChoiceQuestion(poll, alreadyVoted){
      var opts = el("div", "opts");
      var status = el("div", "status", alreadyVoted ? "你已经提交过这一题的答案啦～" : "");
      (poll.options || []).forEach(function(opt){
        var b = el("button", "opt-btn", opt);
        b.type = "button";
        if (alreadyVoted) b.disabled = true;
        b.addEventListener("click", function(){
          if (b.disabled) return;
          opts.querySelectorAll(".opt-btn").forEach(function(x){ x.disabled = true; });
          b.classList.add("picked");
          submitAnswer(poll, opt, {
            statusEl: status,
            unlock: function(){ opts.querySelectorAll(".opt-btn").forEach(function(x){ x.disabled = false; }); b.classList.remove("picked"); }
          });
        });
        opts.appendChild(b);
      });
      app.appendChild(opts);
      app.appendChild(status);
    }

    /* 数字键盘作答：跟老师端 makeNumberPad 一样的按键、一样的按法 */
    function renderNumpadQuestion(poll, alreadyVoted){
      var wrap = el("div", "numpad-wrap");
      var display = el("div", "numpad-display", "＿");
      wrap.appendChild(display);
      var value = "";
      function render(){ display.textContent = value.length ? value : "＿"; }
      var grid = el("div", "numpad-grid");
      var status = el("div", "status", alreadyVoted ? "你已经提交过这一题的答案啦～" : "");
      var locked = alreadyVoted;
      function submit(){
        if (locked || !value.length) return;
        locked = true;
        grid.querySelectorAll(".numpad-key").forEach(function(b){ b.disabled = true; });
        var choiceStr = String(Number(value));
        submitAnswer(poll, choiceStr, {
          statusEl: status,
          unlock: function(){ locked = false; grid.querySelectorAll(".numpad-key").forEach(function(b){ b.disabled = false; }); }
        });
      }
      ["1","2","3","4","5","6","7","8","9","⌫","0","✓"].forEach(function(k){
        var b = el("button", "numpad-key", k);
        b.type = "button";
        if (k === "✓") b.classList.add("go");
        if (locked) b.disabled = true;
        b.addEventListener("click", function(){
          if (locked) return;
          if (k === "⌫"){ value = value.slice(0, -1); render(); return; }
          if (k === "✓"){ submit(); return; }
          if (value.length >= 5) return;
          value += k; render();
        });
        grid.appendChild(b);
      });
      wrap.appendChild(grid);
      app.appendChild(wrap);
      app.appendChild(status);
    }

    /* 拖拽作答：跟老师端 makeDragBlank 一样，点卡片、再点格子放上去
       （手机上直接点，效果等同于拖拽，不用真的拖来拖去也一样方便）。
       payload 里的 tokens/blanks 跟老师端当下那一题的内容完全一样。 */
    function renderDragQuestion(poll, alreadyVoted){
      var payload = poll.payload || {};
      var tokens = payload.tokens || [];
      var blanks = payload.blanks || [];
      if (!tokens.length || !blanks.length){
        app.appendChild(el("div", "waiting", "题目内容有点问题，请等老师重新发布。"));
        return;
      }
      var wrap = el("div", "dragblank-wrap");
      var blankRow = el("div", "dragblank-slots");
      var slotEls = {};
      var chipEls = {};
      var selectedChip = null;
      var locked = alreadyVoted;

      function placeToken(chip, slot){
        if (selectedChip === chip){ selectedChip.classList.remove("selected"); selectedChip = null; }
        slot.dataset.filled = chip.dataset.tokenId;
        slot.textContent = chip.textContent;
        slot.classList.add("filled");
        chip.classList.add("used");
        submitBtn.disabled = !blanks.every(function(b){ return !!slotEls[b.id].dataset.filled; });
      }

      blanks.forEach(function(b){
        var slot = el("div", "drag-slot", "");
        slot.dataset.blankId = b.id;
        slot.dataset.filled = "";
        slotEls[b.id] = slot;
        slot.addEventListener("click", function(){
          if (locked) return;
          if (slot.dataset.filled){
            var tokId = slot.dataset.filled;
            var chip = chipEls[tokId];
            if (chip) chip.classList.remove("used");
            slot.dataset.filled = "";
            slot.textContent = "";
            slot.classList.remove("filled");
            submitBtn.disabled = true;
          } else if (selectedChip){
            placeToken(selectedChip, slot);
          }
        });
        if (b.label){
          var col = el("div", "dragblank-col");
          col.appendChild(el("div", "dragblank-caption", b.label));
          col.appendChild(slot);
          blankRow.appendChild(col);
        } else {
          blankRow.appendChild(slot);
        }
      });
      wrap.appendChild(blankRow);

      var pool = el("div", "dragblank-pool");
      tokens.forEach(function(t){
        var chip = el("div", "drag-chip", t.label);
        chip.dataset.tokenId = t.id;
        chipEls[t.id] = chip;
        chip.addEventListener("click", function(){
          if (locked || chip.classList.contains("used")) return;
          if (selectedChip === chip){ chip.classList.remove("selected"); selectedChip = null; return; }
          if (selectedChip) selectedChip.classList.remove("selected");
          selectedChip = chip; chip.classList.add("selected");
        });
        pool.appendChild(chip);
      });
      wrap.appendChild(pool);

      var hint = el("div", "drag-hint", "☝️ 先点一下卡片，再点上面对应的格子。");
      wrap.appendChild(hint);

      var status = el("div", "status", alreadyVoted ? "你已经提交过这一题的答案啦～" : "");
      var submitBtn = el("button", "drag-submit", "✅ 提交答案");
      submitBtn.type = "button";
      submitBtn.disabled = true;
      submitBtn.addEventListener("click", function(){
        if (locked) return;
        var allFilled = blanks.every(function(b){ return !!slotEls[b.id].dataset.filled; });
        if (!allFilled) return;
        locked = true;
        submitBtn.disabled = true;
        var assembled = blanks.map(function(b){
          var tokId = slotEls[b.id].dataset.filled;
          var tok = tokens.filter(function(t){ return t.id === tokId; })[0];
          return tok ? tok.label : "";
        }).join("|");
        submitAnswer(poll, assembled, {
          statusEl: status,
          unlock: function(){ locked = false; submitBtn.disabled = false; }
        });
      });
      if (locked) submitBtn.disabled = true;
      wrap.appendChild(submitBtn);

      app.appendChild(wrap);
      app.appendChild(status);
    }

    function renderQuestion(poll){
      clearEl(app);
      app.appendChild(el("div", "qtext", poll.question || "（本题）"));
      var alreadyVoted = false;
      try { alreadyVoted = !!localStorage.getItem(votedKey(poll.version)); } catch (e) {}
      var mode = poll.mode || "choice";
      if (mode === "numpad") renderNumpadQuestion(poll, alreadyVoted);
      else if (mode === "drag") renderDragQuestion(poll, alreadyVoted);
      else renderChoiceQuestion(poll, alreadyVoted);
    }

    function hasUsableQuestion(row){
      if (!row || !row.version) return false;
      var mode = row.mode || "choice";
      if (mode === "numpad") return row.correct_option != null && row.correct_option !== "";
      if (mode === "drag") return !!(row.payload && row.payload.tokens && row.payload.tokens.length && row.payload.blanks && row.payload.blanks.length);
      return !!(row.options && row.options.length);
    }

    function applyPoll(row){
      if (!hasUsableQuestion(row)){
        renderWaiting();
        return;
      }
      currentVersion = row.version;
      renderQuestion(row);
    }

    function startVoting(){
      nameGate.hidden = true;
      introText.hidden = true;
      meRow.hidden = false;
      meLabel.textContent = myName;
      app.hidden = false;

      if (typeof window.supabase === "undefined"){
        renderWaiting("暂时连不上服务器，请检查网络后重新整理页面。");
        return;
      }
      try {
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (e) {
        renderWaiting("暂时连不上服务器，请重新整理页面。");
        return;
      }
      client.from("live_poll").select("*").eq("id", "current").maybeSingle().then(function(res){
        if (res.data) applyPoll(res.data);
      });
      pollWatchChannel = client.channel("live-poll-watch")
        .on("postgres_changes", { event: "*", schema: "public", table: "live_poll", filter: "id=eq.current" }, function(payload){
          applyPoll(payload.new);
        })
        .subscribe();
    }

    function tryStart(){
      var v = nameInput.value.trim();
      if (!v){ nameErr.textContent = "请输入名字再进入。"; return; }
      myName = v.slice(0, 12);
      try { localStorage.setItem(NAME_KEY, myName); } catch (e) {}
      startVoting();
    }
    nameGoBtn.addEventListener("click", tryStart);
    nameInput.addEventListener("keydown", function(e){ if (e.key === "Enter") tryStart(); });

    /* 换名字：同一台设备给不同学生轮流用的时候，换人先换名字，也换一个全新的
       身份 id，避免新同学的答题记录跟上一位同学的名字混在一起。 */
    function switchName(){
      try { if (pollWatchChannel && client) client.removeChannel(pollWatchChannel); } catch(e){}
      pollWatchChannel = null;
      client = null;
      myName = "";
      myClientId = makeClientId();
      try {
        localStorage.removeItem(NAME_KEY);
        localStorage.setItem(CLIENT_KEY, myClientId);
      } catch(e){}
      app.hidden = true;
      meRow.hidden = true;
      introText.hidden = false;
      nameInput.value = "";
      nameErr.textContent = "";
      nameGate.hidden = false;
      nameInput.focus();
    }
    changeNameBtn.addEventListener("click", switchName);

    function init(){
      try {
        myClientId = localStorage.getItem(CLIENT_KEY) || "";
        if (!myClientId){ myClientId = makeClientId(); localStorage.setItem(CLIENT_KEY, myClientId); }
      } catch (e) { myClientId = makeClientId(); }

      var savedName = "";
      try { savedName = localStorage.getItem(NAME_KEY) || ""; } catch (e) {}
      if (savedName){
        myName = savedName;
        startVoting();
      } else {
        nameInput.focus();
      }
    }

    init();
  })();
  </script>
</body>
</html>
