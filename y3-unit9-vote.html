<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>举手统计 · 学生作答</title>
<!--
  =====================================================================
  这是「举手统计」的学生作答页，跟 index.html（数据小侦探练习游戏）用
  同一个 Supabase 专案，不需要额外建专案，只需要多建两张表：

  create table if not exists live_poll (
    id text primary key default 'current',
    version int not null default 0,
    question text not null default '',
    options jsonb not null default '[]'::jsonb,
    correct_option text,
    updated_at timestamptz not null default now()
  );
  insert into live_poll (id, version, question, options)
    values ('current', 0, '', '[]'::jsonb)
    on conflict (id) do nothing;

  -- 如果之前已经建过 live_poll / live_votes 表（还没有姓名/正确答案功能），
  -- 只需要多跑这几行，把新栏位加上去就好，不用重建整张表：
  -- alter table live_poll add column if not exists correct_option text;
  -- alter table live_votes add column if not exists name text not null default '';
  -- alter table live_votes add column if not exists client_id text not null default '';

  create table if not exists live_votes (
    id bigint generated by default as identity primary key,
    version int not null,
    choice text not null,
    name text not null default '',
    client_id text not null default '',
    submitted_at timestamptz not null default now()
  );

  alter table live_poll enable row level security;
  alter table live_votes enable row level security;

  drop policy if exists "anyone can read poll" on live_poll;
  create policy "anyone can read poll" on live_poll for select to anon using (true);
  drop policy if exists "anyone can write poll" on live_poll;
  create policy "anyone can write poll" on live_poll for insert to anon with check (true);
  drop policy if exists "anyone can update poll" on live_poll;
  create policy "anyone can update poll" on live_poll for update to anon using (true) with check (true);

  drop policy if exists "anyone can read votes" on live_votes;
  create policy "anyone can read votes" on live_votes for select to anon using (true);
  drop policy if exists "anyone can submit votes" on live_votes;
  create policy "anyone can submit votes" on live_votes for insert to anon with check (true);

  grant usage on schema public to anon, authenticated;
  grant select, insert, update on live_poll to anon;
  grant select, insert on live_votes to anon;

  跑完以上 SQL 后，记得到 Database → Publications，把 live_poll 和
  live_votes 两张表也加进 supabase_realtime，不然老师端和学生端都不会
  即时更新（需要手动按刷新才看得到）。

  学生进入这个页面时会先输入名字（会记住，同一台设备也可以点「换名字」给
  下一位同学用），提交答案时名字会一起送过去，老师那边才知道是谁答对/答错。
  如果老师那一题的选择题有标准答案，老师端还会自动算出「最快答对的前三名」
  排行榜。

  部署方式：把这个文件跟 index.html 放在同一个 GitHub 仓库根目录下，
  一起推上 Vercel，网址就会是 你的网址.vercel.app/y3-unit9-vote.html，
  这个网址就是要发给学生在课堂上打开的。
  =====================================================================
-->
<style>
  :root{
    --bg:#FFF6E9; --panel:#FFFFFF; --ink:#2B2A33; --ink-soft:#6B6879; --line:#EFE2CC;
    --primary:#FF6B4A; --primary-ink:#7A2A18; --secondary:#2EC4B6; --secondary-ink:#0B4A45;
    --wrong-bg:#FFE3E7; --correct-bg:#DFF7EE; --shadow:0 10px 24px -12px rgba(43,42,51,.28);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{ background:var(--panel); border-radius:24px; box-shadow:var(--shadow); padding:28px 24px; max-width:480px; width:100%; text-align:center; }
  .badge{ font-size:34px; margin-bottom:8px; }
  h1{ font-size:18px; margin:0 0 4px; }
  .sub{ font-size:13px; color:var(--ink-soft); margin:0 0 20px; }
  .qtext{ font-size:17px; font-weight:700; margin-bottom:18px; line-height:1.5; }
  .opts{ display:flex; flex-direction:column; gap:12px; }
  .opt-btn{ font:inherit; font-size:17px; font-weight:700; padding:16px; border-radius:16px; border:2px solid var(--line); background:#FFF9F0; cursor:pointer; }
  .opt-btn:active{ transform:scale(.98); }
  .opt-btn.picked{ background:var(--correct-bg); border-color:var(--secondary); }
  .opt-btn[disabled]{ opacity:.55; cursor:default; }
  .status{ margin-top:16px; font-size:14px; font-weight:700; color:var(--secondary-ink); min-height:20px; }
  .status.no{ color:#B4242E; }
  .waiting{ font-size:15px; color:var(--ink-soft); padding:30px 0; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--primary); margin:0 2px; animation:pulse 1.2s infinite ease-in-out; }
  .dot:nth-child(2){ animation-delay:.2s; } .dot:nth-child(3){ animation-delay:.4s; }
  @keyframes pulse{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }
  [hidden]{ display:none !important; }
  .name-input{ width:100%; font:inherit; font-size:16px; padding:12px 14px; border-radius:14px; border:2px solid var(--line); text-align:center; margin-bottom:12px; box-sizing:border-box; }
  .name-input:focus{ outline:none; border-color:var(--primary); }
  .name-go{ width:100%; font:inherit; font-weight:800; font-size:15px; background:var(--primary); color:#fff; border:none; border-radius:14px; padding:12px; cursor:pointer; }
  .name-err{ font-size:12px; color:#B4242E; min-height:16px; margin-top:6px; }
  .me-row{ font-size:12.5px; color:var(--ink-soft); margin:-10px 0 16px; }
  .me-row button{ font:inherit; border:none; background:none; color:var(--primary); text-decoration:underline; cursor:pointer; padding:0; margin-left:4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">🖐️</div>
    <h1>举手统计</h1>
    <p class="sub" id="introText">请先输入你的名字，老师才知道是你答对还是答错。</p>
    <div id="nameGate">
      <input class="name-input" id="nameInput" type="text" maxlength="12" placeholder="例如：小明">
      <button class="name-go" id="nameGoBtn" type="button">进入</button>
      <div class="name-err" id="nameErr"></div>
    </div>
    <div class="me-row" id="meRow" hidden>你是「<span id="meLabel"></span>」<button id="changeNameBtn" type="button">换名字</button></div>
    <div id="app" hidden>
      <div class="waiting">正在连线，等待老师发布题目<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function(){
    "use strict";
    var SUPABASE_URL = "https://lfxabwakcthzcntqvbiy.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmeGFid2FrY3RoemNudHF2Yml5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTk1NTYsImV4cCI6MjEwNDQ3NTU1Nn0.O_5ut2mniPLTgeQ4Cy81_LhOVkgnwfALa7YVAA9PB30";
    var NAME_KEY = "y3vote_name";
    var CLIENT_KEY = "y3vote_client_id";
    var app = document.getElementById("app");
    var introText = document.getElementById("introText");
    var nameGate = document.getElementById("nameGate");
    var nameInput = document.getElementById("nameInput");
    var nameGoBtn = document.getElementById("nameGoBtn");
    var nameErr = document.getElementById("nameErr");
    var meRow = document.getElementById("meRow");
    var meLabel = document.getElementById("meLabel");
    var changeNameBtn = document.getElementById("changeNameBtn");
    var client = null;
    var pollWatchChannel = null;
    var currentVersion = 0;
    var myName = "";
    var myClientId = "";

    function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
    function clearEl(node){ while (node.firstChild) node.removeChild(node.firstChild); }
    function makeClientId(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }

    function votedKey(v){ return "y3vote_v" + v; }

    function renderWaiting(msg){
      clearEl(app);
      app.appendChild(el("div", "waiting", msg || "正在连线，等待老师发布题目…"));
    }

    function renderQuestion(poll){
      clearEl(app);
      app.appendChild(el("div", "qtext", poll.question || "（本题）"));
      var opts = el("div", "opts");
      var alreadyVoted = false;
      try { alreadyVoted = !!localStorage.getItem(votedKey(poll.version)); } catch (e) {}
      var status = el("div", "status", alreadyVoted ? "你已经提交过这一题的答案啦～" : "");
      (poll.options || []).forEach(function(opt){
        var b = el("button", "opt-btn", opt);
        b.type = "button";
        if (alreadyVoted) b.disabled = true;
        b.addEventListener("click", function(){
          if (b.disabled) return;
          opts.querySelectorAll(".opt-btn").forEach(function(x){ x.disabled = true; });
          b.classList.add("picked");
          client.from("live_votes").insert({ version: poll.version, choice: opt, name: myName, client_id: myClientId }).then(function(res){
            if (res.error){
              status.textContent = "提交失败：" + res.error.message;
              status.className = "status no";
              opts.querySelectorAll(".opt-btn").forEach(function(x){ x.disabled = false; });
              b.classList.remove("picked");
              return;
            }
            try { localStorage.setItem(votedKey(poll.version), "1"); } catch (e) {}
            status.textContent = "🎉 提交成功！等老师公布结果吧～";
            status.className = "status";
          }).catch(function(){
            status.textContent = "网络有问题，请再点一次。";
            status.className = "status no";
            opts.querySelectorAll(".opt-btn").forEach(function(x){ x.disabled = false; });
            b.classList.remove("picked");
          });
        });
        opts.appendChild(b);
      });
      app.appendChild(opts);
      app.appendChild(status);
    }

    function applyPoll(row){
      if (!row || !row.version || !row.options || !row.options.length){
        renderWaiting();
        return;
      }
      currentVersion = row.version;
      renderQuestion(row);
    }

    function startVoting(){
      nameGate.hidden = true;
      introText.hidden = true;
      meRow.hidden = false;
      meLabel.textContent = myName;
      app.hidden = false;

      if (typeof window.supabase === "undefined"){
        renderWaiting("暂时连不上服务器，请检查网络后重新整理页面。");
        return;
      }
      try {
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (e) {
        renderWaiting("暂时连不上服务器，请重新整理页面。");
        return;
      }
      client.from("live_poll").select("*").eq("id", "current").maybeSingle().then(function(res){
        if (res.data) applyPoll(res.data);
      });
      pollWatchChannel = client.channel("live-poll-watch")
        .on("postgres_changes", { event: "*", schema: "public", table: "live_poll", filter: "id=eq.current" }, function(payload){
          applyPoll(payload.new);
        })
        .subscribe();
    }

    function tryStart(){
      var v = nameInput.value.trim();
      if (!v){ nameErr.textContent = "请输入名字再进入。"; return; }
      myName = v.slice(0, 12);
      try { localStorage.setItem(NAME_KEY, myName); } catch (e) {}
      startVoting();
    }
    nameGoBtn.addEventListener("click", tryStart);
    nameInput.addEventListener("keydown", function(e){ if (e.key === "Enter") tryStart(); });

    /* 换名字：同一台设备给不同学生轮流用的时候，换人先换名字，也换一个全新的
       身份 id，避免新同学的答题记录跟上一位同学的名字混在一起。 */
    function switchName(){
      try { if (pollWatchChannel && client) client.removeChannel(pollWatchChannel); } catch(e){}
      pollWatchChannel = null;
      client = null;
      myName = "";
      myClientId = makeClientId();
      try {
        localStorage.removeItem(NAME_KEY);
        localStorage.setItem(CLIENT_KEY, myClientId);
      } catch(e){}
      app.hidden = true;
      meRow.hidden = true;
      introText.hidden = false;
      nameInput.value = "";
      nameErr.textContent = "";
      nameGate.hidden = false;
      nameInput.focus();
    }
    changeNameBtn.addEventListener("click", switchName);

    function init(){
      try {
        myClientId = localStorage.getItem(CLIENT_KEY) || "";
        if (!myClientId){ myClientId = makeClientId(); localStorage.setItem(CLIENT_KEY, myClientId); }
      } catch (e) { myClientId = makeClientId(); }

      var savedName = "";
      try { savedName = localStorage.getItem(NAME_KEY) || ""; } catch (e) {}
      if (savedName){
        myName = savedName;
        startVoting();
      } else {
        nameInput.focus();
      }
    }

    init();
  })();
  </script>
</body>
</html>
