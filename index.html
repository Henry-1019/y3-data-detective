<title>数据小侦探</title>
<!--
  ============================================================
  Vercel + Supabase 部署版说明
  ============================================================
  这份文件跟发布在 Claude 里的版本几乎一样，唯一差别是"提交成绩 /
  老师后台"改成用 Supabase 存资料，这样部署到 Vercel（或任何静态网站
  空间）之后依然能收集学生成绩。使用前请完成以下设置：

  1. 到 supabase.com 注册并新建一个 Project。

  2. 在 SQL Editor 里执行以下语句，建立数据表和访问权限：

     create table results (
       id bigint generated by default as identity primary key,
       name text not null,
       scores jsonb not null,
       total_ok int not null default 0,
       total_no int not null default 0,
       submitted_at timestamptz not null default now()
     );
     alter table results enable row level security;
     create policy "anyone can submit" on results
       for insert to anon with check (true);
     create policy "anyone can read" on results
       for select to anon using (true);

  3. 在 Project Settings → API 里找到 Project URL 和 anon public key，
     填到下面 SUPABASE_URL 和 SUPABASE_ANON_KEY 两个位置（搜索 "YOUR_"
     就能找到要改的地方）。

  4. （可选，让老师后台能即时更新）在 Supabase 后台的
     Database → Replication，把 results 这张表的 Realtime 打开。
     没打开也没关系，老师后台会有"🔄 刷新"按钮手动更新。

  5. 把这份文件改名为 index.html，上传到 GitHub 仓库，再到 vercel.com
     用 "Import Project" 连接这个仓库部署，几十秒后就会拿到一个可以
     分享给学生的网址。
  ============================================================
-->

<style>

  .teacher-btn:hover{ background:var(--bg-soft); }

    padding:18px 22px; box-shadow:var(--shadow); text-align:center; }
  .submit-title{ font-weight:800; font-size:14.5px; margin-bottom:12px; }
  .submit-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  .submit-btn{ background:var(--primary); color:#fff; border:none; border-radius:12px; padding:10px 18px; font-weight:800;

  .submit-status{ margin-top:10px; font-size:13px; font-weight:700; min-height:18px; }
  .submit-status.ok{ color:var(--secondary-ink); } .submit-status.no{ color:var(--wrong); }

  .teacher-row{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 16px; border:1px solid var(--line);
    border-radius:14px; background:var(--bg-soft); }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
</style>

<script>
(function(){
"use strict";
function $(id){ return document.getElementById(id); }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t;} return a; }
function distinctInts(n, lo, hi){ var pool=[]; for (var v=lo; v<=hi; v++) pool.push(v); return shuffle(pool).slice(0,n); }
function pickN(arr,n){ return shuffle(arr).slice(0,n); }
function clearEl(el){ while(el.firstChild) el.removeChild(el.firstChild); }
function el(tag,cls,text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
var COLORS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];

function makeChoiceRow(container, options, correctValue, onDone, cls){
  var row = el("div","choices");
  var answered = false;
  options.forEach(function(v){
    var b = el("button", cls || "choice", String(v));
    b.type = "button";
    b.addEventListener("click", function(){
      if (answered) return;
      answered = true;
      row.querySelectorAll(".choice").forEach(function(x){ x.disabled = true; });
      var ok = (v === correctValue);
      b.classList.add(ok ? "correct" : "wrong");
      if (!ok){ row.querySelectorAll(".choice").forEach(function(x){ if (x.textContent == String(correctValue)) x.classList.add("correct"); }); }
      onDone(ok);
    });
    row.appendChild(b);
  });
  container.appendChild(row);
  return row;
}
function uniqueOptionsAround(correct,count,lo,hi,spread){
  var set = new Set([correct]); var guard=0;
  while(set.size<count && guard<300){ guard++; var v=correct+randInt(-spread,spread); if(v>=lo && v<=hi) set.add(v); }
  return shuffle(Array.from(set));
}
function feedbackText(elx, ok, okMsg, noMsg){ elx.textContent = ok ? (okMsg||"🎉 答对了！") : (noMsg||"再想想看～"); elx.className = "feedback " + (ok?"ok":"no"); }

function renderFreqTable(container, categories){
  var wrap = el("div","freq-table");
  var head = el("div","freq-row");
  head.appendChild(el("div","freq-label","食物"));
  head.appendChild(el("div","","记录"));
  head.appendChild(el("div","freq-count","人数"));
  head.style.borderBottom = "2px solid var(--line)";
  wrap.appendChild(head);
  categories.forEach(function(c){
    var row = el("div","freq-row");
    row.appendChild(el("div","freq-label", c.label));
    var checks = el("div","freq-checks");
    for (var i=0;i<c.count;i++) checks.appendChild(el("span","","✓"));
    row.appendChild(checks);
    row.appendChild(el("div","freq-count num", String(c.count)));
    wrap.appendChild(row);
  });
  container.appendChild(wrap);
}

function renderPictogram(container, categories, scale, icon){
  var wrap = el("div","pg-table");
  categories.forEach(function(c){
    var row = el("div","pg-row");
    row.appendChild(el("div","pg-label", c.label));
    var icons = el("div","pg-icons");
    var count = Math.round(c.count/scale);
    for (var i=0;i<count;i++) icons.appendChild(el("span","",icon));
    row.appendChild(icons);
    wrap.appendChild(row);
  });
  container.appendChild(wrap);
  container.appendChild(el("div","pg-key", icon + " 代表 " + scale + " 个"));
}

function renderBarChart(container, categories, missingIdx){
  var max = Math.max.apply(null, categories.map(function(c){return c.count;}));
  var chart = el("div","bar-chart");
  categories.forEach(function(c,i){
    var col = el("div","bar-col");
    var rect = el("div","bar-rect");
    var isMissing = (missingIdx===i);
    rect.style.height = isMissing ? "96px" : (Math.round((c.count/max)*140+6)+"px");
    if (isMissing){ rect.classList.add("missing"); } else { rect.style.background = COLORS[i%COLORS.length]; }
    var val = el("div","bar-label num", isMissing ? "?" : String(c.count));
    col.appendChild(val); col.appendChild(rect); col.appendChild(el("div","bar-label", c.label));
    chart.appendChild(col);
  });
  container.appendChild(chart);
}

function renderPieChart(container, categories){
  var total = categories.reduce(function(s,c){return s+c.count;},0);
  var acc = 0;
  var stops = categories.map(function(c,i){
    var start = acc/total*360; acc += c.count; var end = acc/total*360;
    return COLORS[i%COLORS.length]+" "+start.toFixed(1)+"deg "+end.toFixed(1)+"deg";
  }).join(", ");
  var wrap = el("div","pie-wrap");
  var pie = el("div","pie"); pie.style.background = "conic-gradient(" + stops + ")";
  var legend = el("div","pie-legend");
  categories.forEach(function(c,i){
    var row = el("div","row");
    var sw = el("div","pie-swatch"); sw.style.background = COLORS[i%COLORS.length];
    row.appendChild(sw); row.appendChild(el("span","", c.label + "：" + c.count));
    legend.appendChild(row);
  });
  wrap.appendChild(pie); wrap.appendChild(legend);
  container.appendChild(wrap);
  return total;
}

var SUPABASE_URL = "https://lfxabwakcthzcntqvbiy.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmeGFid2FrY3RoemNudHF2Yml5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTk1NTYsImV4cCI6MjEwNDQ3NTU1Nn0.O_5ut2mniPLTgeQ4Cy81_LhOVkgnwfALa7YVAA9PB30";

var ACTIVITY_LABELS = { classify:"收集分类", pie:"饼分图", compare:"统计图选择", read:"象形条形", word:"解决问题", fill:"图表填空" };
var supabaseClient = null;

function collectScores(){
  var scores = {};
  Object.keys(ACTIVITY_LABELS).forEach(function(key){
    var okEl = $(key+"-ok"), noEl = $(key+"-no");
    var ok = okEl ? Number(okEl.textContent||0) : 0;
    var no = noEl ? Number(noEl.textContent||0) : 0;
    scores[key] = { ok:ok, no:no };
  });
  return scores;
}

function initDb(){
  var configured = SUPABASE_URL.indexOf("YOUR_") !== 0 && SUPABASE_ANON_KEY.indexOf("YOUR_") !== 0;
  if (!configured || typeof window.supabase === "undefined"){ return; }
  try{
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    $("submitBox").hidden = false;
    $("teacherBtn").hidden = false;
  } catch(e){ supabaseClient = null; }
}

function wireSubmit(){
  var btn = $("submitScoreBtn");
  var status = $("submitStatus");
  btn.addEventListener("click", function(){
    var name = $("studentName").value.trim();
    if (!name){ status.textContent = "请先输入姓名再提交～"; status.className="submit-status no"; return; }
    if (!supabaseClient){ status.textContent = "暂时无法连线，请稍后再试。"; status.className="submit-status no"; return; }
    var scores = collectScores();
    var totalOk = 0, totalNo = 0;
    Object.keys(scores).forEach(function(k){ totalOk += scores[k].ok; totalNo += scores[k].no; });
    if (totalOk+totalNo === 0){ status.textContent = "还没有做任何练习哦，先去挑战几关吧！"; status.className="submit-status no"; return; }
    btn.disabled = true;
    supabaseClient.from("results").insert({
      name: name,
      scores: scores,
      total_ok: totalOk,
      total_no: totalNo
    }).then(function(res){
      btn.disabled = false;
      if (res.error){
        status.textContent = "提交失败：" + res.error.message;
        status.className = "submit-status no";
        return;
      }
      status.textContent = "🎉 已提交给老师！共答对 "+totalOk+" 题，答错 "+totalNo+" 题。";
      status.className = "submit-status ok";
    }).catch(function(){
      status.textContent = "提交失败，请检查网络后再试一次。";
      status.className = "submit-status no";
      btn.disabled = false;
    });
  });
}

var realtimeChannel = null;
function loadTeacherRows(list){
  supabaseClient.from("results").select("*").order("submitted_at",{ascending:false}).limit(50).then(function(res){
    clearEl(list);
    if (res.error){ list.appendChild(el("div","teacher-empty","读取成绩时发生问题："+res.error.message)); return; }
    var rows = res.data || [];
    if (!rows.length){ list.appendChild(el("div","teacher-empty","还没有学生提交成绩。")); return; }
    rows.forEach(function(d){
      var row = el("div","teacher-row");
      row.appendChild(el("div","name", d.name || "（未署名）"));
      var tags = el("div","scoretags");
      Object.keys(ACTIVITY_LABELS).forEach(function(k){
        var s = (d.scores && d.scores[k]) || {ok:0,no:0};
        if (s.ok||s.no) tags.appendChild(el("span","tag", ACTIVITY_LABELS[k]+" ✓"+s.ok+" ✗"+s.no));
      });
      row.appendChild(tags);
      var total = el("div","tag", "总计 ✓"+(d.total_ok||0)+" ✗"+(d.total_no||0));
      total.style.fontWeight="800";
      row.appendChild(total);
      var t = d.submitted_at ? new Date(d.submitted_at).toLocaleString() : "";
      row.appendChild(el("div","time", t));
      list.appendChild(row);
    });
  });
}
function renderTeacherPanel(){
  var stage = $("teacher-stage");
  clearEl(stage);
  if (!supabaseClient){
    stage.appendChild(el("div","teacher-empty","暂时无法连线到成绩数据库。"));
    return;
  }
  stage.appendChild(el("div","instr","下面显示学生提交的练习成绩（按提交时间排序，最新的在最上面）。若开启了 Supabase Realtime 会自动更新，否则请按「刷新」查看最新数据。"));
  var refreshBtn = el("button","reshuffle","🔄 刷新"); refreshBtn.type="button";
  stage.appendChild(refreshBtn);
  var list = el("div","teacher-list");
  list.appendChild(el("div","teacher-empty","正在加载…"));
  stage.appendChild(list);
  loadTeacherRows(list);
  refreshBtn.addEventListener("click", function(){ loadTeacherRows(list); });
  if (realtimeChannel){ supabaseClient.removeChannel(realtimeChannel); realtimeChannel = null; }
  try{
    realtimeChannel = supabaseClient.channel("results-changes")
      .on("postgres_changes", {event:"INSERT", schema:"public", table:"results"}, function(){ loadTeacherRows(list); })
      .subscribe();
  } catch(e){ /* realtime not enabled; manual refresh still works */ }
}

$("teacherBtn").addEventListener("click", function(){ showView("view-teacher"); renderTeacherPanel(); });
wireSubmit();
initDb();

})();
